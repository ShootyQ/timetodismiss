<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time To Dismiss — Analytics</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="/styles.css?v=2025-10-03-AN1" />
  <script src="/site-header.js?v=2025-10-13-HDR5" defer></script>
  <style>
    .ana-main{ padding:18px 0 40px; }
    table{ width:100%; border-collapse:separate; border-spacing:0; }
    th,td{ padding:.5rem .65rem; border-bottom:1px solid #e5e7eb; text-align:left; font-size:.85rem; }
    thead th{ background:#f8fafc; font-size:.75rem; letter-spacing:.05em; text-transform:uppercase; color:#334155; }
    .badge{ display:inline-block; padding:.2rem .45rem; border-radius:8px; background:#f1f5f9; font-weight:600; font-size:.65rem; }
    .muted{ color:#64748b; }
    .actions{ display:flex; gap:6px; }
    .small{ font-size:.8rem; }
  </style>
</head>
<body class="sd-body">
  <main class="container ana-main">
    <header class="titlebar" style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;">
      <h1 class="page-title" style="margin:0;">Dismissal Analytics</h1>
      <a href="/admin.html" class="btn btn-outline">Admin</a>
    </header>
    <p class="small muted" id="ctxSchool">—</p>

    <section style="margin-top:10px;">
      <h2 class="page-title" style="font-size:1rem; margin:0 0 6px;">Recent Sessions</h2>
      <div class="small muted" id="sessionsMeta">Loading…</div>
      <div style="overflow:auto; border:1px solid #e5e7eb; border-radius:12px; margin-top:8px;">
        <table aria-label="Recent sessions">
          <thead><tr><th>Date</th><th>Start</th><th>End</th><th>Duration</th><th>Mode</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="sessBody"></tbody>
        </table>
      </div>
    </section>

    <section style="margin-top:34px; max-width:900px;">
      <h2 class="page-title" style="font-size:1rem; margin:0 0 12px;">Session Metrics</h2>
      <div class="small muted" id="sessHint">Select a session above to load per-student metrics for that session.</div>
      <div id="sessionMeta" class="small" style="margin:8px 0 10px;">—</div>
      <div style="overflow:auto; border:1px solid #e5e7eb; border-radius:12px; max-height:520px;">
        <table aria-label="Session student metrics" id="sessionStatsTable">
          <thead><tr>
            <th>Student</th><th>Class</th>
            <th>Called→EnRoute</th><th>EnRoute→Pickup</th><th>Called→Pickup</th>
          </tr></thead>
          <tbody id="sessionStatsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module">
  import { init, colPath, computeStudentDurations, summarizeDayStats, getClasses } from '/app.js?v=23';
  import { getDocs, query, orderBy, limit, updateDoc, doc, serverTimestamp, onSnapshot, getFirestore, collection, where, collectionGroup } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js';
    await init();

    const ctxSchool = document.getElementById('ctxSchool');
    function updateCtx(){ const n = window.SD && (window.SD.schoolName || window.SD.schoolId); if(ctxSchool) ctxSchool.textContent = n || '—'; }
    document.addEventListener('sd:school-changed', updateCtx);
    document.addEventListener('sd:claims-ready', updateCtx);
    updateCtx();

    const sessBody = document.getElementById('sessBody');
    const sessionsMeta = document.getElementById('sessionsMeta');

    function fmt(ts){ if(!ts) return '—'; try{ const d=ts.toDate? ts.toDate(): ts; return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }); }catch{ return '—'; } }
    function dur(start, end){ if(!start) return '—'; const s=start.toDate? start.toDate(): start; const e=end? (end.toDate? end.toDate(): end): new Date(); let ms=e-s; if(ms<0) ms=0; const secs=Math.floor(ms/1000); const m=Math.floor(secs/60); const rs=secs%60; const h=Math.floor(m/60); const rm=m%60; return (h>0? h+':'+String(rm).padStart(2,'0'): rm)+':'+String(rs).padStart(2,'0'); }

    function sessionDay(ts){ try { const d = ts?.toDate? ts.toDate(): (ts||new Date()); return d.toISOString().slice(0,10); } catch { return '—'; } }
  let selectedSessionId = null;
    function renderRows(rows){
      sessionsMeta.textContent = rows.length + ' sessions';
      sessBody.innerHTML = rows.map(r => {
        const ended = !!r.endedAt;
        return `<tr data-id="${r.id}">
          <td>${sessionDay(r.startedAt)}</td>
          <td>${fmt(r.startedAt)}</td>
          <td>${fmt(r.endedAt)}</td>
          <td>${dur(r.startedAt, r.endedAt)}</td>
          <td>${r.mode||''}</td>
          <td>${ended? '<span class="badge">Ended</span>' : '<span class="badge" style="background:#fee2e2;color:#991b1b;">Active</span>'}</td>
          <td class="actions">${ended? `<button data-del="${r.id}" class="btn btn-outline" style="font-size:.65rem; padding:.25rem .45rem;">Delete</button>` : `<button data-end="${r.id}" class="btn btn-danger" style="font-size:.65rem; padding:.25rem .45rem;">End Now</button>`}</td>
        </tr>`;
      }).join('');
      // Auto-select active session or most recent ended one on first load
      try {
        if (!selectedSessionId) {
          const active = rows.find(r => !r.endedAt)?.id || null;
          selectedSessionId = active || (rows[0]?.id || null);
          if (selectedSessionId) loadSessionMetrics(selectedSessionId, rows.find(r=>r.id===selectedSessionId)||null);
        }
      } catch {}
    }

    async function waitForContext(maxMs=15000){ const start=Date.now(); while(Date.now()-start<maxMs){ if(window.SD?.orgId && window.SD?.schoolId) return true; await new Promise(r=>setTimeout(r,120)); } return false; }

    let unsubSessions = null;
    async function attachSessions(retries=3){
      if(unsubSessions){ try{unsubSessions();}catch{} unsubSessions=null; }
      const ready = await waitForContext();
      if(!ready){ sessionsMeta.textContent='Context not ready'; return; }
      try{
        const fs = getFirestore();
        const oid=window.SD.orgId, sid=window.SD.schoolId;
        const coll = collection(fs,'orgs',oid,'schools',sid,'callSessions');
        const q = query(coll, orderBy('startedAt','desc'), limit(25));
        unsubSessions = onSnapshot(q, (snap)=>{
          const rows = snap.docs.map(d=>({ id:d.id, ...d.data() }));
          renderRows(rows);
        }, (err)=>{
          console.warn('[analytics] snapshot error', err);
          sessionsMeta.textContent='Live updates failed';
        });
      }catch(e){
        console.warn('[analytics] attach sessions failed', e);
        if(retries>0){ sessionsMeta.textContent='Retrying…'; setTimeout(()=>attachSessions(retries-1), 600); }
        else sessionsMeta.textContent='Failed to load sessions';
      }
    }

    sessBody.addEventListener('click', async (e) => {
      const endBtn = e.target.closest('button[data-end]');
      const delBtn = e.target.closest('button[data-del]');
      if(!endBtn && !delBtn) return;
      await waitForContext();
      const fs = getFirestore();
      const oid=window.SD?.orgId, sid=window.SD?.schoolId; if(!oid||!sid) { console.warn('Missing context'); return; }
      if(endBtn){
        if(!confirm('End this active session now?')) return;
        try {
          const id = endBtn.getAttribute('data-end');
          const ref = doc(fs,'orgs',oid,'schools',sid,'callSessions',id);
          await updateDoc(ref, { endedAt: serverTimestamp() });
          try {
            const signalRef = doc(fs,'orgs',oid,'schools',sid,'signals','dismissal');
            await updateDoc(signalRef, { message:'Dismissal is over!', lastAt: serverTimestamp(), seq: (window.firebaseIncrementHack||null) });
          } catch {
            try { const { setDoc, increment } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js'); const signalRef2 = doc(fs,'orgs',oid,'schools',sid,'signals','dismissal'); await setDoc(signalRef2,{ message:'Dismissal is over!', lastAt: serverTimestamp(), seq: increment(1) }, { merge:true }); } catch(sigErr){ console.warn('[analytics] dismissal signal failed', sigErr); }
          }
        } catch(err){ console.warn('[analytics] end now failed', err); }
      } else if(delBtn){
        if(!confirm('Delete this session permanently?')) return;
        try {
          const id = delBtn.getAttribute('data-del');
          const ref = doc(fs,'orgs',oid,'schools',sid,'callSessions',id);
          await (await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js')).deleteDoc(ref);
        } catch(err){ console.warn('[analytics] delete failed', err); }
      }
    });
    attachSessions();

  /* ---------------- Session Student Stats ---------------- */
  const sessionStatsBody = document.getElementById('sessionStatsBody');
  const sessionMeta = document.getElementById('sessionMeta');
  let classMap = {};
    try { const cls = await getClasses(); classMap = Object.fromEntries(cls.map(c=>[c.id,c.name||c.id])); } catch{}

    function fmtMs(ms){ if(ms==null) return '—'; const s=Math.floor(ms/1000); const m=Math.floor(s/60); const rs=s%60; const h=Math.floor(m/60); const rm=m%60; return (h>0? h+':'+String(rm).padStart(2,'0'):rm)+':'+String(rs).padStart(2,'0'); }
    // Build session metrics by querying collectionGroup('events') filtered on sessionId
    async function loadSessionMetrics(sessionId, sessionDoc){
      if(!sessionId){ sessionMeta.textContent = 'Pick a session.'; sessionStatsBody.innerHTML=''; return; }
      selectedSessionId = sessionId;
      try {
        const fs = getFirestore();
        // Query all student events for this session across all students
        const qy = query(collectionGroup(fs, 'events'), where('sessionId','==', sessionId));
        const snap = await getDocs(qy);
        const perStudent = new Map(); // id -> { studentName, classId, events: [{status, at}] }
        snap.docs.forEach(d => {
          const ev = d.data() || {};
          const sid = ev.studentId || null; if(!sid) return;
          if (!perStudent.has(sid)) perStudent.set(sid, { studentName: ev.studentName||'', classId: ev.classId||'', events: [] });
          perStudent.get(sid).events.push({ status: ev.status, at: ev.at });
        });
        // Derive first times for each status within this session
        const rows = [];
        perStudent.forEach((val, sid) => {
          // sort by at timestamp
          val.events.sort((a,b)=>{
            try { return a.at.toDate() - b.at.toDate(); } catch { return 0; }
          });
          let calledAt=null, enRouteAt=null, pickedUpAt=null;
          val.events.forEach(e => {
            if(e.status==='called' && !calledAt) calledAt = e.at;
            if((e.status==='en_route'||e.status==='enroute') && !enRouteAt) enRouteAt = e.at;
            if(e.status==='picked_up' && !pickedUpAt) pickedUpAt = e.at;
          });
          rows.push({ id: sid, studentName: val.studentName, classId: val.classId, calledAt, enRouteAt, pickedUpAt });
        });
        // Render table
        rows.sort((a,b)=> (a.studentName||'').localeCompare(b.studentName||''));
        const tr = [];
        function toMs(ts){ try { return ts?.toDate?.()?.getTime?.() || 0; } catch { return 0; } }
        function fmtMs(ms){ if(!ms) return '—'; const s=Math.floor(ms/1000); const m=Math.floor(s/60); const rs=s%60; const h=Math.floor(m/60); const rm=m%60; return (h>0? h+':'+String(rm).padStart(2,'0'):rm)+':'+String(rs).padStart(2,'0'); }
        let totalCTE=0, nCTE=0, totalETP=0, nETP=0, totalCTP=0, nCTP=0;
        rows.forEach(r => {
          const c = toMs(r.calledAt), e = toMs(r.enRouteAt), p = toMs(r.pickedUpAt);
          const cte = (c && e) ? (e - c) : 0;
          const etp = (e && p) ? (p - e) : 0;
          const ctp = (c && p) ? (p - c) : 0;
          if(cte){ totalCTE+=cte; nCTE++; }
          if(etp){ totalETP+=etp; nETP++; }
          if(ctp){ totalCTP+=ctp; nCTP++; }
          tr.push(`<tr><td>${(r.studentName||'').replace(/</g,'&lt;')}</td><td>${(classMap[r.classId]||'').replace(/</g,'&lt;')}</td><td>${cte? fmtMs(cte):'—'}</td><td>${etp? fmtMs(etp):'—'}</td><td>${ctp? fmtMs(ctp):'—'}</td></tr>`);
        });
        sessionStatsBody.innerHTML = tr.join('');
  const avg = (t,n) => n? fmtMs(Math.round(t/n)) : '—';
  const started = (sessionDoc && sessionDoc.startedAt && sessionDoc.startedAt.toDate) ? sessionDoc.startedAt.toDate() : null;
  const ended = (sessionDoc && sessionDoc.endedAt && sessionDoc.endedAt.toDate) ? sessionDoc.endedAt.toDate() : null;
        sessionMeta.textContent = `${rows.length} students • Avg C→E ${avg(totalCTE,nCTE)} • Avg E→P ${avg(totalETP,nETP)} • Avg C→P ${avg(totalCTP,nCTP)}${started? ' • Started '+started.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}${ended? ' • Ended '+ended.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}`;
      } catch(e){
        sessionMeta.textContent = 'Failed to load session metrics';
        sessionStatsBody.innerHTML = '';
        console.warn('[analytics] loadSessionMetrics failed', e);
      }
    }

    // Click a session row to load metrics for that session
    sessBody.addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-id]'); if(!tr) return;
      const id = tr.getAttribute('data-id'); if(!id) return;
      const data = { id, startedAt: null, endedAt: null };
      try { data.startedAt = tr.children[1]?.textContent; } catch {}
      loadSessionMetrics(id, null);
    });
  </script>
</body>
</html>
