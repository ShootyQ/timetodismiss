<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time To Dismiss — Roles</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="/styles.css?v=2025-09-08-ROLES3" />
  <link rel="preconnect" href="https://www.gstatic.com" />
  <script src="/site-header.js?v=2025-09-10-HDR4" defer></script>
  <style>
    .wrap { max-width: 1024px; margin: 24px auto; padding: 12px; }
    .grid { display:grid; gap:14px; grid-template-columns: 1fr 320px; align-items:start; }
    .card { border:1px solid #e5e7eb; border-radius:14px; padding:14px; background:#fff; }
    .muted { color:#64748b; font-size:12px; }
    .input, textarea, select { width:100%; padding:10px 12px; border:1px solid #e5e7eb; border-radius:10px; }
    textarea { min-height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .btn { padding:10px 14px; border-radius:10px; border:1px solid #e2e8f0; background:#fff; cursor:pointer; }
    .btn.primary { background:#2563eb; color:#fff; border-color:#2563eb; }
    .btn[disabled] { opacity: .6; cursor:not-allowed; }
    .row, .list-header { display:grid; grid-template-columns: 1fr 90px 90px 90px 90px; gap:10px; align-items:center; }
    .row { padding:10px 12px; border-bottom:1px solid #f1f5f9; }
    .list-header { padding:10px 12px; background:#f8fafc; font-weight:600; border:1px solid #e5e7eb; border-bottom:none; border-top-left-radius:14px; border-top-right-radius:14px; }
    .list { border:1px solid #e5e7eb; border-top:none; border-bottom-left-radius:14px; border-bottom-right-radius:14px; }
    .role-cell { text-align:center; }
  .status { font-size:12px; white-space:pre-wrap; border:1px dashed #cbd5e1; border-radius:10px; padding:8px 10px; background:#f8fafc; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid #e5e7eb; margin-left:6px; }
  /* Multi-row add */
  .rows-toolbar{ display:flex; gap:10px; align-items:center; margin-top:12px; }
  .member-rows{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .member-row{ display:grid; grid-template-columns: 1fr 180px 90px; gap:10px; align-items:end; }
  .member-row .actions{ display:flex; gap:8px; }
  @media (max-width: 720px){ .member-row{ grid-template-columns: 1fr; } }
  </style>

  <!-- Your Firebase bootstrap handled by site-header.js -->
</head>
<body class="sd-body">
  <site-header data-active="roles"></site-header>

  <main class="wrap">
    <h1>Role Management</h1>

    <div class="grid">
      <!-- Bulk add -->
      <section class="card">
        <h2 style="margin-top:0">Add members</h2>
        <label class="muted" for="bulk">Paste emails (one per line, or comma/space separated). Optional per-line role with comma:<br>
          <code>person@example.com, caller</code> · roles: <code>viewer</code>, <code>caller</code>, <code>admin</code>
        </label>
        <textarea id="bulk" placeholder="jane@school.org
john@school.org, caller
lead@school.org, admin"></textarea>

        <div style="display:flex; gap:10px; margin-top:10px">
          <select id="bulkRole" class="input" style="max-width:220px" aria-label="Default role for pasted emails">
            <option value="viewer">Viewer (default)</option>
            <option value="caller">Caller</option>
            <option value="admin">Admin</option>
          </select>
          <button id="bulkAddBtn" class="btn primary">Add</button>
          <button id="refreshBtn" class="btn">Refresh access</button>
          <span id="ctx" class="muted" style="align-self:center"></span>
        </div>

        <div class="rows-toolbar">
          <button id="addRowBtn" class="btn" type="button" aria-label="Add another row">＋ Add row</button>
          <span class="muted">Or add by rows (defaults to Admin).</span>
        </div>
        <div id="memberRows" class="member-rows" aria-live="polite"></div>

        <div id="bulkStatus" class="status" style="margin-top:10px; display:none"></div>
      </section>

      <!-- Legend -->
      <section class="card">
        <h3 style="margin-top:0">What each role can do</h3>
        <div class="muted">
          <p><b>Admin</b> — full control of school (classes, students, settings, roles).</p>
          <p><b>Caller</b> — run dismissal and update students.</p>
          <p><b>Viewer</b> — read-only; may flip <i>Called → En route</i>.</p>
        </div>
      </section>
    </div>

    <div style="height:16px"></div>

    <!-- Roster -->
    <div class="list-header">
      <div>User</div>
      <div class="role-cell">Viewer</div>
      <div class="role-cell">Caller</div>
      <div class="role-cell">Admin</div>
      <div class="role-cell">Remove</div>
    </div>
    <div id="list" class="list"></div>
  </main>

  <script type="module">
    console.log('[TTD] Build 2025-09-08-ROLES3');
    // Robust Firebase init: check compat/modular; try relative and absolute app.js
    async function hasModularApp(){
      try {
        const appMod = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js');
        const apps = appMod.getApps?.() || [];
        return apps.length > 0;
      } catch { return false; }
    }
    function isCompatReady(){
      try { return !!(window.firebase && Array.isArray(window.firebase.apps) && window.firebase.apps.length > 0); }
      catch { return false; }
    }
    async function ensureApp(){
      if (isCompatReady() || await hasModularApp()) return true;
      const attempts = [
        './app.js?v=21','/app.js?v=21',
        './app.js?v=20','/app.js?v=20',
        './app.js','/app.js'
      ];
      for (const p of attempts){
        try {
          const mod = await import(p);
          const maybeInit = (mod && (mod.init || mod.default));
          if (typeof maybeInit === 'function') {
            await maybeInit();
          } else if (typeof mod?.init === 'function') {
            await mod.init();
          } else if (typeof window.init === 'function') {
            await window.init();
          }
          // short poll for app presence after import
          for (let i=0;i<20;i++){
            if (isCompatReady() || await hasModularApp()){
              console.log('[roles] Firebase initialized via', p);
              return true;
            }
            await new Promise(r=>setTimeout(r,100));
          }
        } catch (e) {
          // continue to next attempt
        }
      }
      // final wait just in case another script initializes later
      for (let i=0;i<20;i++){
        if (isCompatReady() || await hasModularApp()) return true;
        await new Promise(r=>setTimeout(r,100));
      }
      console.warn('[roles] Firebase app not initialized. Check app.js path.', location.pathname);
      const el = document.getElementById('list');
      try { if (el) el.innerHTML = '<div class="row"><div class="muted">Firebase init not detected. Check app.js path and cache. ('+location.pathname+')</div></div>'; } catch {}
      return false;
    }
    await ensureApp();
    // ——— compat vs modular helpers ———
    // isCompatReady defined above
    let authMod, functionsMod;

    async function getAuth() {
      if (!(isCompatReady()) && !(await hasModularApp())) await ensureApp();
      if (isCompatReady()) return window.firebase.auth();
      if (!authMod) {
        const m = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js');
        authMod = m.getAuth();
      }
      return authMod;
    }
    async function httpsCallable(name) {
      if (!(isCompatReady()) && !(await hasModularApp())) await ensureApp();
      if (isCompatReady()) {
        const fn = window.firebase.functions().httpsCallable(name);
        return async (data) => {
          const res = await fn(data);
          return res?.data;
        };
      }
      if (!functionsMod) {
        const m = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-functions.js');
        functionsMod = m.getFunctions();
      }
      const { httpsCallable: call } = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-functions.js');
      return (data) => call(functionsMod, name)(data).then(r => r.data);
    }
    async function currentUser() {
      const a = await getAuth();
      return a.currentUser;
    }
    async function getClaims(force=false) {
      const u = await currentUser();
      if (!u) return {};
  if (isCompatReady()) {
        const t = await u.getIdTokenResult(force);
        return t.claims || {};
      } else {
        const { getIdTokenResult } = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js');
        const t = await getIdTokenResult(u, force);
        return t.claims || {};
      }
    }
    function isAdminClaim(claims){
      if (!claims) return false;
      if (claims.admin === true) return true;
      if (claims.role && String(claims.role).toLowerCase() === 'admin') return true;
      if (claims.roles && (claims.roles.admin === true || (Array.isArray(claims.roles) && claims.roles.includes('admin')))) return true;
      return false;
    }
    const roleToBools = (role) => {
      role = String(role || 'viewer').toLowerCase();
      return { admin: role === 'admin', caller: role === 'admin' || role === 'caller', viewer: true };
    };
    function roleFromMember(m) {
      const r = String(m.role || '').toLowerCase();
      if (r === 'admin' || r === 'caller' || r === 'viewer') return r;
      const b = m.roles || {};
      if (b.admin) return 'admin';
      if (b.caller) return 'caller';
      return 'viewer';
    }
    const escapeHtml = (s)=>String(s||'').replace(/[&<>"'`=\/]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'}[c]));

    // ——— elements ———
    const listEl = document.getElementById('list');
    const bulkEl = document.getElementById('bulk');
    const bulkRoleEl = document.getElementById('bulkRole');
    const bulkAddBtn = document.getElementById('bulkAddBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const bulkStatusEl = document.getElementById('bulkStatus');
    const ctxEl = document.getElementById('ctx');
  const addRowBtn = document.getElementById('addRowBtn');
  const memberRowsEl = document.getElementById('memberRows');

    // ——— context ———
    async function resolveCtx() {
      const url = new URL(location.href);
      const qOrg = url.searchParams.get('org');
      const qSch = url.searchParams.get('school');
      const claims = await getClaims(true);
      const orgId = qOrg || claims.orgId || (Array.isArray(claims.orgIds) && claims.orgIds[0]) || (window.SD && window.SD.orgId);
      const schoolId = qSch || claims.schoolId || (Array.isArray(claims.schoolIds) && claims.schoolIds[0]) || (window.SD && window.SD.schoolId);
      if (!orgId || !schoolId) throw new Error('Missing orgId/schoolId in context.');
      return { orgId, schoolId };
    }

    // ——— roster UI ———
    function renderRow(member, ctx) {
      const role = roleFromMember(member);
      const id = member.id || member.uid;
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div>
          <div>${escapeHtml(member.displayName || member.email || 'Unknown')}</div>
          <div class="muted">${escapeHtml(member.email || '')}</div>
        </div>
        ${['viewer','caller','admin','none'].map(opt => `
          <div class="role-cell">
            <input type="radio" name="r-${id}" value="${opt}" ${role===opt ? 'checked' : ''}>
          </div>`).join('')}
      `;
      row.querySelectorAll(`input[name="r-${id}"]`).forEach(input => {
        input.addEventListener('change', async () => {
          if (!input.checked) return;
          await saveRole(ctx, member, input.value);
        });
      });
      return row;
    }

    async function loadMembers(ctx) {
      const call = await httpsCallable('listSchoolMembers');
  const res = await call({ orgId: ctx.orgId, schoolId: ctx.schoolId });
  const members = (res?.members || []).sort((a,b)=>
        String(a.displayName||a.email||'').localeCompare(String(b.displayName||b.email||''), 'en', {sensitivity:'base'})
      );
      listEl.innerHTML = '';
      members.forEach(m => listEl.appendChild(renderRow(m, ctx)));
    }

    async function saveRole(ctx, member, roleChoice) {
      const call = await httpsCallable('setSchoolMemberRoles');
      const roles = (roleChoice === 'none') ? {} : roleToBools(roleChoice);
      await call({
        orgId: ctx.orgId,
        schoolId: ctx.schoolId,
        user: { uid: member.uid || member.id, email: member.email || null },
        roles
      });
      const a = await getAuth();
      if (a.currentUser) await a.currentUser.getIdToken(true);
      await loadMembers(ctx);
    }

    // ——— bulk add ———
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/i;
    function parseBulk(text, defaultRole) {
      const out = [];
      const raw = (text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for (const line of raw) {
        // support comma or whitespace/semicolon separated emails on one line
        const parts = line.split(/[,\t;]+/).map(s=>s.trim()).filter(Boolean);
        // case A: "email, role"
        if (parts.length >= 2 && emailRe.test(parts[0])) {
          const role = String(parts[1]).toLowerCase();
          const r = (role === 'admin' || role === 'caller' || role === 'viewer') ? role : defaultRole;
          out.push({ email: parts[0].toLowerCase(), role: r });
        } else {
          // treat the whole line as a bag of emails
          const emails = line.split(/[,\s;]+/).map(s=>s.trim()).filter(Boolean);
          for (const e of emails) if (emailRe.test(e)) out.push({ email: e.toLowerCase(), role: defaultRole });
        }
      }
      // dedupe by email (last wins)
      const map = new Map();
      for (const item of out) map.set(item.email, item);
      return Array.from(map.values());
    }

    // Row-based add helpers
    function renderMemberRow(pref={}){
      const row = document.createElement('div');
      row.className = 'member-row';
      row.innerHTML = `
        <div>
          <label class="muted">Email</label>
          <input class="input member-email" type="email" placeholder="teacher@school.org" value="${escapeHtml(pref.email||'')}">
        </div>
        <div>
          <label class="muted">Role</label>
          <select class="input member-role">
            <option value="viewer">Viewer</option>
            <option value="caller">Caller</option>
            <option value="admin" selected>Admin</option>
          </select>
        </div>
        <div class="actions">
          <button type="button" class="btn remove-row">Remove</button>
        </div>
      `;
      row.querySelector('.remove-row')?.addEventListener('click', () => {
        if (memberRowsEl && row.parentElement === memberRowsEl) memberRowsEl.removeChild(row);
      });
      return row;
    }
    function addMemberRow(pref={}){
      if (!memberRowsEl) return;
      const r = renderMemberRow(pref);
      memberRowsEl.appendChild(r);
      try { r.querySelector('.member-email')?.focus(); } catch {}
    }

    async function bulkAdd(ctx) {
      const defaultRole = bulkRoleEl.value || 'viewer';
      // Parse textarea + rows and merge (rows win)
      const entriesFromPaste = parseBulk(bulkEl.value, defaultRole);
      const rows = Array.from(memberRowsEl?.querySelectorAll('.member-row') || []);
      const entriesFromRows = [];
      for (const n of rows){
        const email = String(n.querySelector('.member-email')?.value || '').trim().toLowerCase();
        const role = String(n.querySelector('.member-role')?.value || 'admin').trim().toLowerCase();
        if (!email) continue;
        if (!emailRe.test(email)) continue;
        const r = (role === 'admin' || role === 'caller' || role === 'viewer') ? role : 'admin';
        entriesFromRows.push({ email, role: r });
      }
      const map = new Map();
      for (const e of entriesFromPaste) map.set(e.email, e);
      for (const e of entriesFromRows) map.set(e.email, e);
      const entries = Array.from(map.values());
      if (!entries.length) {
        showStatus('Nothing to add. Enter rows or paste emails first.');
        return;
      }

      bulkAddBtn.disabled = true;
      showStatus(`Adding ${entries.length} member(s)…`);

      const call = await httpsCallable('setSchoolMemberRoles');

      // simple concurrency limiter
      const limit = 5;
      let idx = 0, ok = 0, fail = 0;
      const results = [];

      async function runOne(entry) {
        try {
          await call({
            orgId: ctx.orgId,
            schoolId: ctx.schoolId,
            user: { email: entry.email },
            roles: roleToBools(entry.role)
          });
          results.push(`✔ ${entry.email}  (${entry.role})`);
          ok++;
        } catch (e) {
          results.push(`✖ ${entry.email}  (${entry.role})  — ${e?.message || e}`);
          fail++;
        } finally {
          idx++;
          showStatus(`Processed ${idx}/${entries.length}\n` + results.slice(-6).join('\n'));
        }
      }

      const queue = entries.slice();
      const workers = new Array(Math.min(limit, queue.length)).fill(0).map(async () => {
        while (queue.length) await runOne(queue.shift());
      });
      await Promise.all(workers);

      // refresh acting admin claims + list
      const a = await getAuth();
      if (a.currentUser) await a.currentUser.getIdToken(true);
      await loadMembers(ctx);

  showStatus(`Done. Added: ${ok}, Failed: ${fail}\n` + results.join('\n'));
  bulkAddBtn.disabled = false;
  if (memberRowsEl) memberRowsEl.innerHTML = '';
  addMemberRow();
    }

    function showStatus(text) {
      bulkStatusEl.style.display = 'block';
      bulkStatusEl.textContent = text;
    }

    // ——— events ———
    bulkAddBtn.addEventListener('click', async () => {
      const ctx = await resolveCtx();
      await bulkAdd(ctx);
    });
    refreshBtn.addEventListener('click', async () => {
      const a = await getAuth();
      if (a.currentUser) await a.currentUser.getIdToken(true);
      const ctx = await resolveCtx();
      await loadMembers(ctx);
    });
  addRowBtn?.addEventListener('click', () => addMemberRow());

    // ——— boot ———
    (async () => {
      await ensureApp();
      let tries = 0;
      while (!(await currentUser()) && tries++ < 40) await new Promise(r => setTimeout(r, 250));
      const claims = await getClaims(true);
      if (!isAdminClaim(claims)){
        const main = document.querySelector('main.wrap');
        if (main) main.innerHTML = '<h1>Role Management</h1><p class="muted">Access restricted. Admins only.</p>';
        return;
      }
      let ctx;
      try {
        ctx = await resolveCtx();
      } catch {
        // Wait for a school selection (e.g., superintendent without default school)
        ctxEl.textContent = 'Org: — • School: Select a school…';
        document.addEventListener('sd:school-changed', async () => {
          const sc = { orgId: window.SD?.orgId, schoolId: window.SD?.schoolId };
          if (!sc.orgId || !sc.schoolId) return;
          ctxEl.textContent = `Org: ${sc.orgId} • School: ${window.SD?.schoolName || sc.schoolId}`;
          await loadMembers(sc);
        }, { once: true });
        return;
      }
      ctxEl.textContent = `Org: ${ctx.orgId} • School: ${(window.SD && window.SD.schoolName) || ctx.schoolId}`;
      await loadMembers(ctx);
      addMemberRow();
    })();

    // Live-update banner when user switches school
    document.addEventListener('sd:school-changed', async (e) => {
      const d = e?.detail || {};
      if (!d.orgId || !d.schoolId) return;
      ctxEl.textContent = `Org: ${d.orgId} • School: ${d.schoolName || d.schoolId}`;
      await loadMembers({ orgId: d.orgId, schoolId: d.schoolId });
    });
  </script>
</body>
</html>
