name: Deploy live site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-aftercare-functions:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISMISSALCALLER }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT_DISMISSALCALLER is missing or empty."
            exit 1
          fi
          key_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key_file"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$key_file" || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT_DISMISSALCALLER is not valid JSON."
            exit 1
          }

      - name: Test Aftercare Functions
        run: npm install --prefix functions && npm test --prefix functions

      - name: Deploy Aftercare Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISMISSALCALLER }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          firebase --project dismissalcaller deploy --only functions:getAftercareAdminData,functions:saveAftercareSettings,functions:saveAftercareFamily,functions:archiveAftercareFamily,functions:clockInAftercareStudent,functions:clockOutAftercareStudent,functions:getAftercareReport,functions:getAftercareDaySessions,functions:updateAftercareSession,functions:deleteAftercareSession,functions:autoCloseAftercareSessions
