name: Deploy to Firebase Hosting (dev channel)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Tools
        run: npm i -g firebase-tools

      - name: Deploy to Firebase Hosting (preview dev channel)
        env:
          FIREBASE_SERVICE_ACCOUNT_DISMISSALCALLER: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISMISSALCALLER }}
        run: |
          echo "Using service account auth via GOOGLE_APPLICATION_CREDENTIALS"
          export GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase_key.json
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_DISMISSALCALLER" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase --project dismissalcaller hosting:channel:deploy dev --expires 7d --non-interactive

      - name: Post preview URL
        run: |
          echo "Dev preview URL:" >> $GITHUB_STEP_SUMMARY
          echo "https://dev--dismissalcaller.web.app" >> $GITHUB_STEP_SUMMARY
