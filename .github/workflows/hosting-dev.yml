name: Deploy dev preview to Firebase Hosting

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying? (optional)"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISMISSALCALLER }}'
          projectId: dismissalcaller
          channelId: dev
          expires: 7d
