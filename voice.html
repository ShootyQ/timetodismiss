<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time To Dismiss — Voice Caller</title>
  <style>
    :root { --blue:#2563eb; --red:#dc2626; --gray:#64748b; --bg:#f1f5f9; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, Inter, sans-serif; background:var(--bg); color:#111827; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:1.5rem 1rem 3rem; }
    h1 { margin:.25rem 0 1rem; font-size:clamp(1.4rem,2.5vw,2rem); text-align:center; }
    p.hint { margin:.25rem 0 1.25rem; color:var(--gray); font-size:.95rem; }
    .row { display:flex; gap:1rem; align-items:center; justify-content:center; flex-wrap:wrap; }
    button { font-family:inherit; font-weight:600; cursor:pointer; border-radius:14px; border:1px solid #e2e8f0; background:#fff; padding:.85rem 1.25rem; font-size:1rem; display:inline-flex; align-items:center; gap:.55rem; box-shadow:0 1px 2px rgba(0,0,0,.05); transition:background .2s, transform .08s; }
    button:hover { background:#f8fafc; }
    button:active { transform:translateY(1px); }
    .primary { background:var(--blue); color:#fff; border-color:var(--blue); }
    .primary:hover { background:#1d4ed8; }
    .danger { background:var(--red); color:#fff; border-color:var(--red); }
    .danger:hover { background:#b91c1c; }
    #activateBtn { font-size:1.1rem; }
    #micBtn { width:92px; height:92px; border-radius:50%; font-size:2rem; justify-content:center; position:relative; }
    #micBtn.pulse::after { content:""; position:absolute; inset:-10px; border-radius:50%; background:radial-gradient(circle at center, rgba(37,99,235,.35), transparent); animation:pulse 1.2s infinite ease-in-out; }
    @keyframes pulse { 0%{opacity:.55; transform:scale(.9);} 50%{opacity:1; transform:scale(1);} 100%{opacity:0; transform:scale(1.3);} }
    #status { margin-top:1rem; font-size:1.05rem; font-weight:500; min-height:1.4em; text-align:center; }
    #studentCard { margin-top:1.75rem; background:#fff; border:1px solid #e2e8f0; border-radius:20px; padding:1.1rem 1.25rem 1.25rem; width:100%; max-width:460px; box-shadow:0 4px 14px -2px rgba(0,0,0,.08); display:none; }
    #studentCard header { display:flex; flex-direction:column; gap:.35rem; margin-bottom:.75rem; }
    #studentName { font-size:1.35rem; font-weight:700; line-height:1.2; }
    #studentMeta { color:var(--gray); font-size:.9rem; }
    .actions { display:grid; gap:.65rem; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); }
    .actions button { width:100%; padding:.75rem .75rem; font-size:.9rem; }
    .actions button.nevermind { background:#f1f5f9; }
    .small { font-size:.75rem; opacity:.8; margin-top:.8rem; text-align:center; }
    #altMatches { margin-top:.6rem; display:flex; gap:.4rem; flex-wrap:wrap; }
    #altMatches button { font-size:.7rem; padding:.35rem .55rem; border-radius:8px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <h1>Voice Caller</h1>
  <p class="hint" id="hint">1. Activate voice  2. Tap mic  3. Say a student's name (e.g. “Ava Johnson”).</p>
  <div class="row" id="activationRow">
    <button id="activateBtn" class="primary">Enable Voice Access</button>
    <button id="micBtn" class="danger hidden" aria-pressed="false" title="Start Listening">🎤</button>
  </div>
  <div id="status">Idle</div>

  <section id="studentCard" aria-live="polite" aria-atomic="true">
    <header>
      <div id="studentName">Student Name</div>
      <div id="studentMeta"></div>
    </header>
    <div class="actions">
      <button id="btnCall" class="primary">Call</button>
      <button id="btnFamily">Call Family</button>
      <button id="btnRide">Call Ride Share</button>
      <button id="btnNevermind" class="nevermind">Nevermind</button>
    </div>
    <div id="altMatches" class="small"></div>
  </section>

  <script type="module">
    import { init, onStudents, onCarGroups, setStudentStatus } from '/app.js?v=23';
    await init();

    const activateBtn   = document.getElementById('activateBtn');
    const micBtn        = document.getElementById('micBtn');
    const statusEl      = document.getElementById('status');
    const studentCard   = document.getElementById('studentCard');
    const studentNameEl = document.getElementById('studentName');
    const studentMetaEl = document.getElementById('studentMeta');
    const altMatchesEl  = document.getElementById('altMatches');
    const btnCall       = document.getElementById('btnCall');
    const btnFamily     = document.getElementById('btnFamily');
    const btnRide       = document.getElementById('btnRide');
    const btnNevermind  = document.getElementById('btnNevermind');
    const hintEl        = document.getElementById('hint');

    let recog = null; let listening=false; let lastHeard = ''; let lastShownStudent=null; let rearmTimer=null;

    // ------------------ Data Structures + Matching ------------------
    const store = { students: [], byFull:new Map() };
    const numWords = new Map([['k','k'],['kindergarten','k'],['first','1'],['1st','1'],['second','2'],['2nd','2'],['third','3'],['3rd','3'],['fourth','4'],['4th','4'],['fifth','5'],['5th','5'],['sixth','6'],['6th','6']]);
    const norm = (s) => String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
    const simplifyClass = (s)=> norm(s).split(' ').map(w=>numWords.get(w)||w).join(' ');
    const soundex = (s)=>{ const str=String(s||'').toUpperCase().replace(/[^A-Z]/g,''); if(!str) return ''; const first=str[0]; const map={B:1,F:1,P:1,V:1,C:2,G:2,J:2,K:2,Q:2,S:2,X:2,Z:2,D:3,T:3,L:4,M:5,N:5,R:6}; let prev=map[first]||0,out=first,c=1; for(let i=1;i<str.length&&c<4;i++){ const ch=str[i]; const code=map[ch]||0; if(code!==0&&code!==prev){ out+=code; c++; } prev=code; } while(out.length<4) out+='0'; return out.slice(0,4); };
    function prepStudent(s){ const derived=[s.firstName,s.lastName].filter(Boolean).join(' '); const name=String(s.name||derived||'').trim(); const [first='',...rest]=name.split(/\s+/); const last=rest.join(' '); return { id:s.id, name, first:first.toLowerCase(), last:last.toLowerCase(), className:(s.className||s.classId||s.grade||''), classKey:simplifyClass(s.className||s.classId||s.grade||''), carTag:(s.carTag||s.tag? String(s.carTag||s.tag).toUpperCase():''), full:norm(name), sxFirst:soundex(first), sxLast:soundex(last) }; }
    function levenshtein(a,b){ a=norm(a); b=norm(b); const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n); const dp=new Array(n+1); for(let j=0;j<=n;j++) dp[j]=j; for(let i=1;i<=m;i++){ let prev=dp[0]++; for(let j=1;j<=n;j++){ const tmp=dp[j]; dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev + (a[i-1]===b[j-1]?0:1)); prev=tmp; } } return dp[n]; }
    function similarity(a,b){ const A=norm(a), B=norm(b); if(!A||!B) return 0; const dist=levenshtein(A,B); return 1 - (dist / Math.max(A.length,B.length)); }
    function matchCandidates(qRaw){ const q=norm(qRaw); if(!q) return []; const out=[]; const qParts=q.split(' '); const qFirst=qParts[0]; const qLast=qParts.length>1? qParts[qParts.length-1]:''; const sxF=soundex(qFirst); const sxL=soundex(qLast); for(const s of store.students){ let score = similarity(q, s.full); if(s.full.startsWith(q)) score = Math.max(score, .92); if(q.includes(s.first) && q.includes(s.last)) score=Math.max(score,.9); if(s.first===qFirst) score=Math.max(score,.85); if(s.first.startsWith(qFirst)) score=Math.max(score,.78); if(sxF && s.sxFirst===sxF) score=Math.max(score,.8); if(qLast && sxL && s.sxLast===sxL) score=Math.max(score, score+.03); if(score>0.55) out.push({student:s, score:Math.min(1,score)}); }
      out.sort((a,b)=>b.score-a.score); return out.slice(0,5); }

    // ------------------ UI Helpers ------------------
    function showStudentCard(stu, alts){ lastShownStudent = stu; studentNameEl.textContent = stu.name || 'Unnamed'; studentMetaEl.textContent = [stu.className, stu.carTag? 'Tag '+stu.carTag : ''].filter(Boolean).join(' • '); studentCard.style.display='block'; altMatchesEl.innerHTML=''; if(alts && alts.length>1){ altMatchesEl.textContent='Or:'; alts.slice(1).forEach(c=>{ const b=document.createElement('button'); b.type='button'; b.textContent=c.student.name; b.addEventListener('click',()=> showStudentCard(c.student, alts)); altMatchesEl.appendChild(b); }); } }
    function hideStudentCard(){ studentCard.style.display='none'; lastShownStudent=null; }
    function cleanPhrase(t){ return t.replace(/\b(call|please|thank(s| you)|pickup|pick up|pick)\b/gi,'').replace(/[\.,!?]/g,' ').replace(/\s+/g,' ').trim(); }

    // ------------------ Speech Recognition ------------------
    function ensureRecognizer(){ if(recog) return true; const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR){ alert('This browser does not support Speech Recognition. Try Chrome desktop.'); return false;} recog = new SR(); recog.continuous=true; recog.lang='en-US'; recog.interimResults=false; recog.onresult = ev => { const res = ev.results[ev.results.length-1][0]; const phraseRaw = res.transcript; const conf = (res.confidence||0).toFixed(2); const phrase = phraseRaw.toLowerCase(); if(phrase === lastHeard) return; lastHeard = phrase; statusEl.textContent = 'Heard: '+phraseRaw+' ('+conf+')'; processHeard(phrase); }; recog.onerror = e => { statusEl.textContent = 'Error: '+e.error; }; recog.onend = () => { if(listening){ try{ recog.start(); }catch(_){} } }; return true; }
    function toggleMic(){ if(!listening){ if(!ensureRecognizer()) return; try{ recog.start(); }catch(_){} listening=true; micBtn.classList.add('pulse'); micBtn.setAttribute('aria-pressed','true'); statusEl.textContent='Listening...'; } else { listening=false; try{ recog.stop(); }catch(_){} micBtn.classList.remove('pulse'); micBtn.setAttribute('aria-pressed','false'); statusEl.textContent='Paused'; } }
    micBtn.addEventListener('click', toggleMic);
    activateBtn.addEventListener('click', ()=>{ // One-time permission warm-up
      if(!ensureRecognizer()) return; activateBtn.classList.add('hidden'); micBtn.classList.remove('hidden'); hintEl.textContent='Tap the mic, then speak a student name.'; statusEl.textContent='Ready'; });

    // ------------------ Action Buttons ------------------
    async function callStudent(stu){ try { await setStudentStatus(stu.id,'called'); statusEl.textContent='Called → '+stu.name; } catch(e){ console.error(e); statusEl.textContent='Call failed'; } }
    async function callByTagLocal(tag){ const TAG=String(tag||'').toUpperCase(); const matches=store.students.filter(s=>s.carTag===TAG); if(!matches.length) return 0; await Promise.allSettled(matches.map(s=> setStudentStatus(s.id,'called'))); return matches.length; }
    btnCall.addEventListener('click', ()=>{ if(lastShownStudent) callStudent(lastShownStudent); });
    btnFamily.addEventListener('click', async ()=>{ if(!lastShownStudent || !lastShownStudent.carTag){ statusEl.textContent='No tag for family'; return;} const cnt=await callByTagLocal(lastShownStudent.carTag); statusEl.textContent = cnt? 'Family tag '+lastShownStudent.carTag+' → '+cnt+' student(s) called':'No family found'; });
    btnRide.addEventListener('click', async ()=>{ if(!lastShownStudent || !lastShownStudent.carTag){ statusEl.textContent='No tag for ride share'; return;} const cnt=await callByTagLocal(lastShownStudent.carTag); statusEl.textContent = cnt? 'Ride share tag '+lastShownStudent.carTag+' → '+cnt+' student(s) called':'No ride share found'; });
    btnNevermind.addEventListener('click', ()=>{ hideStudentCard(); statusEl.textContent='Cleared'; });

    // ------------------ Phrase Processing ------------------
    function processHeard(raw){ if(rearmTimer){ clearTimeout(rearmTimer); rearmTimer=null; } const cleaned = cleanPhrase(raw); if(!cleaned){ statusEl.textContent='(Ignored)'; return; } if(!store.students.length){ statusEl.textContent='Roster not loaded yet'; return; } const candidates=matchCandidates(cleaned); if(!candidates.length){ statusEl.textContent='No student match for “'+cleaned+'”'; return; } const best=candidates[0]; showStudentCard(best.student, candidates); // auto-arm again after 2.5s if still listening
      rearmTimer = setTimeout(()=>{ if(listening) statusEl.textContent='Listening...'; }, 2500); }

    // ------------------ Live Data ------------------
    onStudents(null, list => { const rows=Array.isArray(list)? list:[]; store.students = rows.map(prepStudent); store.byFull=new Map(); for(const s of store.students){ if(!store.byFull.has(s.full)) store.byFull.set(s.full,[]); store.byFull.get(s.full).push(s); } statusEl.textContent = `Roster: ${store.students.length} students loaded`; });
    onCarGroups(groups => { /* reserved: can use for additional grouping logic later */ });
  </script>
</body>
</html>
