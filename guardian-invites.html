<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guardian Invites — Admin</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="/styles.css?v=2025-09-07-MC7" />
  <link rel="preconnect" href="https://www.gstatic.com" />
  <script src="/site-header.js?v=2025-10-13-HDR6" defer></script>
  <style>
    .wrap{ max-width: 980px; margin:0 auto; padding: 18px; }
    .section{ padding: 36px 0; }
    .card{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; box-shadow:0 8px 24px rgba(15,23,42,.05); }
    .grid{ display:grid; gap:12px; }
    .muted{ color:#64748b; }
    label{ font-weight:700; }
    input, select{ width:100%; border:1px solid #e5e7eb; border-radius:10px; padding:.6rem .7rem; }
    .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .out{ background:#f8fafc; border:1px solid #e5e7eb; border-radius:10px; padding:10px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body class="sd-body">
  <main>
    <section class="section">
      <div class="wrap">
  <h1>Guardian Invites</h1>
  <p class="muted">Create a one-time link or code to let a guardian claim a student. Recent invites appear below for quick copy or revocation.</p>

        <div id="guard" class="card" style="display:none; margin-top:10px;">
          <p><strong>Access denied.</strong> You need Admin access for a school to create invites.</p>
        </div>

        <div id="formCard" class="card" style="margin-top:10px;">
          <div class="grid">
            <div class="row">
              <label>Student (doc ID or SIS ID)
                <input id="studentId" placeholder="e.g., student doc id or SIS ID" />
              </label>
              <label>Relationship
                <select id="rel">
                  <option value="primary" selected>Primary</option>
                  <option value="secondary">Secondary</option>
                </select>
              </label>
            </div>
            <div class="row">
              <label>Guardian email (optional)
                <input id="email" type="email" placeholder="guardian@example.com" />
              </label>
              <label>Valid days
                <select id="days">
                  <option>7</option>
                  <option selected>14</option>
                  <option>30</option>
                </select>
              </label>
            </div>
            <div class="actions">
              <button id="createBtn" class="btn btn-primary" type="button">Create Invite</button>
              <span id="status" class="muted"></span>
            </div>
          </div>
        </div>

        <div id="resultCard" class="card" style="display:none; margin-top:10px;">
          <h3 style="margin:0 0 6px;">Invite created</h3>
          <div class="grid">
            <div>
              <div class="muted">Magic link</div>
              <div id="linkOut" class="out" style="word-break:break-all;"></div>
            </div>
            <div>
              <div class="muted">Short code</div>
              <div id="codeOut" class="out"></div>
            </div>
          </div>
          <div class="actions" style="margin-top:8px;">
            <button id="copyLink" class="btn" type="button">Copy link</button>
            <button id="newInvite" class="btn btn-outline" type="button">New invite</button>
          </div>
        </div>

        <div id="invitesCard" class="card" style="display:none; margin-top:10px;">
          <h3 style="margin:0 0 10px;">Recent Invites</h3>
          <div id="invitesEmpty" class="muted" style="display:none;">No invites yet.</div>
          <div id="invitesList" style="display:grid; gap:10px;"></div>
          <div class="actions" style="margin-top:12px;">
            <button id="refreshInvites" class="btn" type="button">Refresh</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Requires Admin for the current school. Uses callable createGuardianInvite.
    async function ready(){
      const status = document.getElementById('status');
      const guard = document.getElementById('guard');
      const card  = document.getElementById('formCard');
      const res   = document.getElementById('resultCard');
      const linkOut = document.getElementById('linkOut');
      const codeOut = document.getElementById('codeOut');
      const copyLink = document.getElementById('copyLink');
      const newInvite= document.getElementById('newInvite');
      const createBtn= document.getElementById('createBtn');

      function setGuard(v){ guard.style.display = v ? '' : 'none'; card.style.display = v ? 'none' : ''; }

      // Wait for claims and a selected school
      const claims = (window.SD && window.SD.claims) || {};
      const roles = (window.SD && window.SD.roles) || {};
      const orgId = window.SD && window.SD.orgId;
      const schoolId = window.SD && window.SD.schoolId;
      const canAdmin = !!(roles && roles.admin);
      if (!canAdmin || !orgId || !schoolId){ setGuard(true); return; }

      // ---- Guardian backend call helper with callable -> HTTP fallback ----
      const CF_BASE = 'https://us-central1-dismissalcallerdev.cloudfunctions.net';
      const HTTP_ENDPOINTS = {
        createGuardianInvite: CF_BASE + '/guardianInviteCreateHttp',
        listGuardianInvites: CF_BASE + '/guardianInviteListHttp',
        revokeGuardianInvite: CF_BASE + '/guardianInviteRevokeHttp',
      };

      async function callGuardian(name, payload){
        // Try callable first (fast path; handles auth automatically)
        try {
          const call = window.SD?.httpsCallable ? window.SD.httpsCallable(name) : null;
          if (call) {
            return await call(payload || {});
          }
        } catch (e) {
          try { console.warn('[guardian] callable failed, falling back to HTTP:', e?.message||e); } catch {}
        }
        // HTTP fallback with explicit CORS and bearer token
        const token = await (window.firebase?.auth?.()?.currentUser?.getIdToken?.());
        if (!token) throw new Error('Not authenticated');
        const url = HTTP_ENDPOINTS[name];
        if (!url) throw new Error('No HTTP endpoint for ' + name);
        if (name === 'listGuardianInvites'){
          const p = payload || {};
          const u = new URL(url);
            u.searchParams.set('orgId', p.orgId);
            u.searchParams.set('schoolId', p.schoolId);
            if (p.status) u.searchParams.set('status', p.status);
            if (p.limit)  u.searchParams.set('limit',  String(p.limit));
          const r = await fetch(u.toString(), { headers: { Authorization: 'Bearer ' + token } });
          const j = await r.json();
          return { data: j };
        } else {
          const r = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify(payload || {})
          });
          const j = await r.json();
          return { data: j };
        }
      }

      async function resolveStudentId(orgId, schoolId, input){
        // Use compat Firestore already initialized by site-header.js to avoid version mismatch
        try{
          const db = window.firebase && firebase.firestore ? firebase.firestore() : null;
          if (!db) return { error: 'no-db' };
          // Try direct document id
          try {
            const ds = await db.collection('orgs').doc(orgId).collection('schools').doc(schoolId).collection('students').doc(input).get();
            if (ds.exists){
              const d = ds.data() || {};
              return { id: ds.id, name: d.name || [d.firstName,d.lastName].filter(Boolean).join(' ') || ds.id };
            }
          } catch {}
          // Try SIS id field (id)
          try {
            const qy = await db.collection('orgs').doc(orgId).collection('schools').doc(schoolId).collection('students')
              .where('id','==', input).limit(2).get();
            if (qy.size === 1){
              const doc0 = qy.docs[0];
              const d = doc0.data() || {};
              return { id: doc0.id, name: d.name || [d.firstName,d.lastName].filter(Boolean).join(' ') || doc0.id, via:'sis' };
            }
            if (qy.size > 1){ return { error: 'multiple' }; }
          } catch {}
          return { error: 'not-found' };
        } catch(e){ return { error: 'lookup-failed', message: e?.message || String(e) }; }
      }

      function renderInvites(invites){
        const list = document.getElementById('invitesList');
        const empty = document.getElementById('invitesEmpty');
        list.innerHTML='';
        if (!invites.length){ empty.style.display=''; list.style.display='none'; return; }
        empty.style.display='none'; list.style.display='grid';
        for (const inv of invites){
          const row = document.createElement('div');
          row.style.display='grid';
          row.style.gridTemplateColumns='minmax(160px,1fr) minmax(200px,2fr) minmax(110px,1fr) auto';
          row.style.gap='10px';
          row.style.alignItems='center';
          row.style.border='1px solid #e5e7eb';
          row.style.padding='8px 10px';
          row.style.borderRadius='10px';
          const statusColor = inv.status==='pending' ? '#2563eb' : (inv.status==='consumed' ? '#16a34a' : '#6b7280');
          row.innerHTML = `
            <div style="font-weight:600;">${inv.studentName}</div>
            <div style="font-size:.8rem; word-break:break-all; color:#475569;">${inv.link}</div>
            <div style="font-size:.75rem; font-weight:700; color:${statusColor}; text-transform:uppercase; letter-spacing:.5px;">${inv.status}</div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-sm" data-copy="${inv.link}" type="button">Copy</button>
              ${inv.status==='pending' ? `<button class="btn btn-sm btn-outline" data-revoke="${inv.id}" type="button">Revoke</button>`:''}
            </div>`;
          list.appendChild(row);
        }
        // Wire copy/revoke
        list.querySelectorAll('[data-copy]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const val = btn.getAttribute('data-copy');
            try { await navigator.clipboard.writeText(val); btn.textContent='Copied'; setTimeout(()=>btn.textContent='Copy',900); } catch {}
          });
        });
        list.querySelectorAll('[data-revoke]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-revoke');
            if (!confirm('Revoke this invite?')) return;
            try {
              const resp = await callGuardian('revokeGuardianInvite', { orgId, schoolId, inviteId: id });
              if (!resp?.data?.ok) throw new Error('Failed to revoke');
              await loadInvites();
            } catch(e){ alert('Could not revoke: ' + (e.message||'error')); }
          });
        });
      }

      async function loadInvites(){
        try {
          const resp = await callGuardian('listGuardianInvites', { orgId, schoolId, status: 'all', limit: 50 });
          const invites = resp?.data?.invites || [];
          document.getElementById('invitesCard').style.display='';
          renderInvites(invites);
        } catch(e){ console.warn('Invite list failed', e); }
      }

      async function create(){
        const studentId = document.getElementById('studentId').value.trim();
        const email = document.getElementById('email').value.trim();
        const relationshipType = document.getElementById('rel').value;
        const daysValid = Number(document.getElementById('days').value) || 14;
        if (!studentId){ alert('Enter a student ID'); return; }
        status.textContent = 'Looking up student…';
        try {
          // Resolve the entered value to a real student document id
          const resolved = await resolveStudentId(orgId, schoolId, studentId);
          if (resolved?.error === 'not-found') { status.textContent=''; alert('Student not found. Enter the student document ID or the SIS ID from the roster.'); return; }
          if (resolved?.error === 'multiple') { status.textContent=''; alert('Multiple students matched that SIS ID. Please use the student document ID instead.'); return; }
          if (resolved?.error) { status.textContent=''; alert('Lookup failed. ' + (resolved.message || 'Try again.')); return; }

          status.textContent = 'Creating…';
          const resp = await callGuardian('createGuardianInvite', { orgId, schoolId, studentId: resolved.id, email: email||null, relationshipType, daysValid });
          const data = (resp && resp.data) || resp || {};
          if (!data.ok) throw new Error('Failed to create invite');
          const link = location.origin + (data.link || '/claim.html');
          linkOut.textContent = link;
          codeOut.textContent = data.code8 || '';
          res.style.display = '';
          status.textContent = 'Invite ready';
          // Refresh recent invites list
          loadInvites();
        } catch (e) {
          console.error(e);
          alert('Could not create invite: ' + (e.message || e.code || 'error'));
          status.textContent = '';
        }
      }

      createBtn.addEventListener('click', create);
      copyLink.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(linkOut.textContent); copyLink.textContent = 'Copied!'; setTimeout(()=>copyLink.textContent='Copy link', 1200); } catch {}
      });
      newInvite.addEventListener('click', () => { res.style.display = 'none'; status.textContent=''; document.getElementById('studentId').focus(); });
      document.getElementById('refreshInvites').addEventListener('click', loadInvites);
      // Initial load of existing invites
      loadInvites();
    }

    // Listen on document (site-header dispatches on document)
    document.addEventListener('sd:claims-ready', ready, { once: true });
    // If claims already present (fast path), initialize immediately
    if (window.SD && window.SD.claims) {
      try { ready(); } catch {}
    }
  </script>
</body>
</html>
