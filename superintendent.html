<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Time To Dismiss — Superintendent</title>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<link rel="stylesheet" href="/styles.css?v=2025-09-06-MC4" />
	<link rel="preconnect" href="https://www.gstatic.com" />
	<script src="/site-header.js?v=2025-09-10-HDR4" defer></script>
	<style>
		.sup-main{ padding:18px 0 28px; }
		.titlebar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; border-bottom:1px solid #e5e7eb; padding-bottom:10px; }
		.titlebar .page-title{ margin:0; font-size:1.4rem; font-weight:800; }
		.muted{ color: var(--muted); }
		.small{ font-size:.95rem; }
		.sup-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
		.field{ display:flex; flex-direction:column; gap:6px; }
		.field input, .field select{ background:#fff; border:1px solid #d1d5db; color:#0b132b; border-radius:12px; padding:.55rem .7rem; }
		.row-between{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
		.list{ list-style:none; padding:0; margin:0; display:grid; gap:10px; }
		.school-item{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:10px 12px; }
		.admin-list{ list-style:none; padding:6px 0 0; margin:6px 0 0; display:grid; gap:6px; }
		.admin-pill{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:10px; padding:6px 8px; }
		.admin-pill small{ color: var(--muted); }
	</style>
	<script>
		// Lightweight toast helper (text-only)
		function setToast(msg, isErr){
			const t = document.getElementById('toast');
			if(!t) return; t.textContent = msg || ''; t.style.color = isErr ? '#b91c1c' : 'var(--muted)';
			if(msg) setTimeout(()=>{ if(t.textContent===msg) t.textContent=''; }, 4000);
		}

		function readyFirebase(){ return window.firebase && firebase.apps && firebase.apps.length; }

		function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

		function renderQuota({ used=0, allowed=0 }){
			const u = document.getElementById('quotaUsed');
			const a = document.getElementById('quotaAllowed');
			const p = document.getElementById('quotaProgress');
			if(u) u.textContent = used;
			if(a) a.textContent = allowed;
			if(p){ p.max = Math.max(allowed, 0); p.value = Math.min(used, p.max); }
			const btn = document.getElementById('addSchoolBtn');
			if(btn) btn.disabled = (allowed && used >= allowed);
		}

		// Renders schools with live admin counts from state
		function renderSchools(list){
			const ul = document.getElementById('schoolsList');
			const sel = document.getElementById('schoolSel');
			if(!ul) return;
			ul.innerHTML = '';
			(list || []).forEach(s => {
				const li = document.createElement('li');
				li.className = 'school-item';
				const count = (window.__ADMIN_COUNTS__ && typeof window.__ADMIN_COUNTS__[s.id] === 'number') ? window.__ADMIN_COUNTS__[s.id] : (Array.isArray(s.admins) ? s.admins.length : 0);
				const admins = (window.__ADMIN_LIST__ && Array.isArray(window.__ADMIN_LIST__[s.id])) ? window.__ADMIN_LIST__[s.id] : [];
				const aid = `admins-${s.id}`;
				li.innerHTML = `
				  <div class="row-between">
				    <strong>${escapeHtml(s.name || s.id)}</strong>
				    <span class="muted small">Admins: <span data-admin-count for="${s.id}">${count}</span></span>
				  </div>
				  <ul id="${aid}" class="admin-list"></ul>
				`;
				// Render current admin rows
				const ulAdmins = li.querySelector('#'+aid);
				if (admins.length === 0){
					const empty = document.createElement('li');
					empty.className = 'muted small';
					empty.textContent = 'No admins yet';
					ulAdmins.appendChild(empty);
				} else {
					admins.forEach(a => {
						const row = document.createElement('li');
						row.className = 'admin-pill';
						const name = a.displayName ? `${a.displayName}` : '';
						const email = a.email || '';
						row.innerHTML = `<div><strong>${escapeHtml(name || email || a.uid || '')}</strong>${email && name ? ` <small>${escapeHtml(email)}</small>` : ''}</div>` +
						  `<div><button class="btn btn-outline small" data-action="remove-admin" data-school-id="${s.id}" data-uid="${a.uid || a.id}">Remove</button></div>`;
						ulAdmins.appendChild(row);
					});
				}
				ul.appendChild(li);
			});
			if(sel){
				sel.innerHTML = '';
				(list || []).forEach(s => {
					const opt = document.createElement('option');
					opt.value = s.id; opt.textContent = s.name || s.id; sel.appendChild(opt);
				});
			}
		}

		function initPortal(ctx){
			const { db, fx, orgId } = ctx;
			const addBtn = document.getElementById('addSchoolBtn');
			const inviteForm = document.getElementById('inviteForm');
			// make orgId available for admin actions
			window.__ORG_ID__ = orgId;

			// State for quota reconciliation
			const state = { allowed: 0, usedFromOrg: 0, schoolsCount: 0 };

			// Live quota from org doc
			const orgRef = db.collection('orgs').doc(orgId);
			orgRef.onSnapshot((snap) => {
				const d = snap.data() || {};
				state.allowed = Number(d.allowedSchools || 0);
				state.usedFromOrg = Number(d.usedSchools || 0);
				// Prefer live schools count to avoid stale usedSchools after manual deletions
				renderQuota({ used: state.schoolsCount || state.usedFromOrg, allowed: state.allowed });
			});

			// Live schools list (subcollection) with admin counts
			db.collection('orgs').doc(orgId).collection('schools')
				.orderBy('name')
				.onSnapshot((qs) => {
					const list = [];
					qs.forEach(doc => list.push({ id: doc.id, ...(doc.data()||{}) }));
					// Update quota based on live count
					state.schoolsCount = list.length;
					renderQuota({ used: state.schoolsCount || state.usedFromOrg, allowed: state.allowed });
					// cache list for re-render on admin updates
					window.__SCHOOLS_CACHE__ = list;
					// Start/refresh admin listeners per school
					ensureAdminCounts(db, orgId, list.map(s => s.id));
					renderSchools(list);
				});

			addBtn?.addEventListener('click', async () => {
				const name = prompt('New school name');
				if(!name) return;
				try{
					const addSchool = (fx ? fx : firebase.app().functions('us-central1')).httpsCallable('addSchool');
					await addSchool({ orgId, schoolName: name });
					setToast('School created.');
				}catch(e){
					console.error(e);
					const msg = e?.message || '';
					const code = e?.code || '';
					setToast(`Failed to add school${code?` [${code}]`:''}${msg?`: ${msg}`:''}`, true);
				}
			});

			inviteForm?.addEventListener('submit', async (e) => {
				e.preventDefault();
				const email = document.getElementById('inviteEmail')?.value?.trim();
				const schoolId = document.getElementById('schoolSel')?.value;
				const role = document.getElementById('roleSel')?.value || 'admin';
				if(!email || !schoolId){ setToast('Email and school are required.', true); return; }
				try{
					const inviteUser = (fx ? fx : firebase.app().functions('us-central1')).httpsCallable('inviteUser');
					await inviteUser({ email, orgId, schoolId, role });
					setToast('Invitation sent.');
					e.target.reset();
				}catch(err){
					const msg = err?.message || '';
					const code = err?.code || '';
					setToast(`Failed to invite user${code?` [${code}]`:''}${msg?`: ${msg}`:''}`, true);
				}
			});
		}

		async function requireSuperintendent(){
			const gate = document.getElementById('gateMsg');
			const portal = document.getElementById('portal');
			if(!readyFirebase()){
				gate.textContent = 'Loading…';
				let tries = 0;
				const wait = await new Promise((resolve)=>{
					const iv = setInterval(()=>{ if(readyFirebase() || tries++ > 80){ clearInterval(iv); resolve(true); } }, 100);
				});
			}

			const auth = firebase.auth();
			const db = firebase.firestore();
			const fx = (window.SD && window.SD.functions) ? window.SD.functions : null;

			auth.onAuthStateChanged(async (user) => {
				if(!user){ try { location.replace('/index.html#login'); } catch { location.href = '/index.html#login'; } portal.hidden = true; return; }
				try{
					const tr = await user.getIdTokenResult(true);
					const claims = tr?.claims || {};
					const isSup = !!claims.superintendent || claims.role === 'superintendent';
					const isOwner = !!claims.owner || claims.role === 'owner';
					if(!isSup && !isOwner){ try { location.replace('/index.html#login'); } catch { location.href = '/index.html#login'; } portal.hidden = true; return; }
						const badge = document.getElementById('roleBadge');
						if (badge) badge.textContent = isOwner ? 'Owner' : 'Superintendent';
					const orgId = (Array.isArray(claims.orgIds) && claims.orgIds[0]) || window.SD?.orgId || localStorage.getItem('SD_ORG') || '';
					if(!orgId){ gate.textContent = 'No organization assigned.'; portal.hidden = true; return; }
					gate.textContent = ''; portal.hidden = false;
					initPortal({ db, fx, orgId });
				}catch(e){ gate.textContent = 'Error loading permissions.'; portal.hidden = true; console.error(e); }
			});
		}

		document.addEventListener('DOMContentLoaded', requireSuperintendent);
	</script>
	<script>
		// Maintain live admin counts per school (supports roles array OR roles.admin map)
		(function(){
			// schoolId -> combined unsubscribe
			let unsubMap = new Map();
			window.__ADMIN_COUNTS__ = window.__ADMIN_COUNTS__ || {};
			window.__ADMIN_LIST__ = window.__ADMIN_LIST__ || {};
			function buildUnsub(unsubs){ return () => { for (const u of unsubs) { try { u(); } catch {} } } }
			window.ensureAdminCounts = function(db, orgId, schoolIds){
				// Unsubscribe removed schools
				for (const [sid, unsub] of Array.from(unsubMap.entries())){
					if (!schoolIds.includes(sid)) { try { unsub(); } catch {}; unsubMap.delete(sid); delete window.__ADMIN_COUNTS__[sid]; delete window.__ADMIN_LIST__[sid]; }
				}
				// Subscribe new schools
				for (const sid of schoolIds){
					if (unsubMap.has(sid)) continue;
					try{
						const base = db.collection('orgs').doc(orgId).collection('schools').doc(sid).collection('members');
						const listeners = [];
						// Maintain per-source arrays so removals are reflected
						const store = (window.__ADMIN_LIST_SOURCES__ = window.__ADMIN_LIST_SOURCES__ || {});
						store[sid] = store[sid] || { array: [], map: [] };
						const recalc = () => {
							const arr = [...(store[sid].array || []), ...(store[sid].map || [])];
							const uniq = new Map();
							arr.forEach(x => { const key = x.uid || x.id; if (!key) return; if (!uniq.has(key)) uniq.set(key, x); });
							window.__ADMIN_LIST__[sid] = Array.from(uniq.values());
							window.__ADMIN_COUNTS__[sid] = window.__ADMIN_LIST__[sid].length;
							document.dispatchEvent(new CustomEvent('ttd:admins-updated'));
						};
						// roles array format
						listeners.push(base.where('roles', 'array-contains', 'admin').onSnapshot((qs)=>{
							store[sid].array = qs.docs.map(d=>({ id:d.id, uid:(d.data()||{}).uid||d.id, email:(d.data()||{}).email||'', displayName:(d.data()||{}).displayName||'' }));
							recalc();
						}));
						// roles map format
						listeners.push(base.where('roles.admin', '==', true).onSnapshot((qs)=>{
							store[sid].map = qs.docs.map(d=>({ id:d.id, uid:(d.data()||{}).uid||d.id, email:(d.data()||{}).email||'', displayName:(d.data()||{}).displayName||'' }));
							recalc();
						}));
						unsubMap.set(sid, buildUnsub(listeners));
					}catch(e){ console.warn('admin listen failed for', sid, e); }
				}
			};
			// Re-render schools list whenever admins change
			document.addEventListener('ttd:admins-updated', () => {
				try { if (window.__SCHOOLS_CACHE__) renderSchools(window.__SCHOOLS_CACHE__); } catch {}
			});
		})();
	</script>
	<script>
		// Admin actions (remove admin)
		(function(){
			document.addEventListener('DOMContentLoaded', () => {
				const ul = document.getElementById('schoolsList');
				if (!ul) return;
				ul.addEventListener('click', async (e) => {
					const btn = e.target.closest('button[data-action="remove-admin"]');
					if (!btn) return;
					const schoolId = btn.getAttribute('data-school-id');
					const uid = btn.getAttribute('data-uid');
					if (!schoolId || !uid) return;
					if (!confirm('Remove this admin from the school?')) return;
					try{
						const fx = (window.SD && window.SD.functions) ? window.SD.functions : firebase.app().functions('us-central1');
						const setRoles = fx.httpsCallable('setSchoolMemberRoles');
						await setRoles({ orgId: window.__ORG_ID__, schoolId, user: { uid }, roles: { admin:false, caller:false, viewer:false } });
						setToast('Admin removed.');
					}catch(err){
						console.error(err);
						setToast('Failed to remove admin: ' + (err?.message || err), true);
					}
				});
			});
		})();
	</script>
	<script>
		// Delete School UI & handler
		(function(){
			document.addEventListener('DOMContentLoaded', () => {
				const listCard = document.querySelector('#schoolsList')?.closest('.card');
				if (!listCard) return;
				const wrap = document.createElement('div');
				wrap.className = 'mt-12';
				wrap.innerHTML = `
				  <div class="card" style="border:1px solid #fee2e2;background:#fff7f7;">
				    <h4 class="card-title" style="color:#991b1b;">Delete School</h4>
				    <p class="small muted">This permanently deletes the selected school and its data. This action cannot be undone.</p>
				    <div class="field" style="max-width:420px;">
				      <label for="delSchoolSel">School</label>
				      <select id="delSchoolSel"></select>
				    </div>
				    <div class="mt-8">
				      <button id="deleteSchoolBtn" class="btn btn-outline" type="button" style="border-color:#ef4444;color:#991b1b;">Delete School</button>
				    </div>
				  </div>`;
				listCard.parentElement.appendChild(wrap);
				// Keep delete select in sync with main school select
				const srcSel = document.getElementById('schoolSel');
				const dstSel = document.getElementById('delSchoolSel');
				function syncOptions(){ if (!srcSel || !dstSel) return; dstSel.innerHTML = srcSel.innerHTML; }
				const obs = new MutationObserver(syncOptions);
				if (srcSel) obs.observe(srcSel, { childList: true });
				syncOptions();
				// Wire delete
				document.getElementById('deleteSchoolBtn')?.addEventListener('click', async () => {
					const schoolId = dstSel?.value || '';
					if (!schoolId) { alert('Select a school to delete.'); return; }
					if (!confirm(`Delete school ${schoolId}? This cannot be undone.`)) return;
					try{
						const fx = (window.SD && window.SD.functions) ? window.SD.functions : firebase.app().functions('us-central1');
						const del = fx.httpsCallable('deleteSchool');
						await del({ schoolId }); // orgId resolved in backend from token or SD.orgId
						alert('School deleted. It may take a moment to fully disappear.');
					}catch(e){ console.error(e); alert('Delete failed: ' + (e?.message || e)); }
				});
			});
		})();
	</script>
</head>
<body class="sd-body">
	<main class="container sup-main">
		<header class="titlebar">
			<h1 class="page-title">Superintendent Dashboard</h1>
			<span id="roleBadge" class="muted small">Restricted</span>
		</header>

		<p id="gateMsg" class="small muted">Checking access…</p>

		<div id="portal" hidden>
			<section class="sup-grid" aria-labelledby="overview-h">
				<article class="card" aria-live="polite">
					<h3 class="card-title">Quota</h3>
								<p class="muted small">Schools used: <strong id="quotaUsed">0</strong> of <strong id="quotaAllowed">0</strong></p>
								<progress id="quotaProgress" value="0" max="0" class="w-100"></progress>
				</article>

							<article class="card">
					<h3 class="card-title">Add School</h3>
					<p class="muted small">Create a new school in your district (within your quota).</p>
					<button id="addSchoolBtn" class="btn btn-primary" type="button">Add School</button>
				</article>
			</section>

						<section class="mt-12" aria-labelledby="schools-h">
				<article class="card">
					<div class="row-between">
						<h3 id="schools-h" class="card-title">Schools</h3>
						<span id="toast" class="muted small" aria-live="polite"></span>
					</div>
					<ul id="schoolsList" class="list" aria-live="polite"></ul>
				</article>
			</section>

						<section class="mt-12" aria-labelledby="invite-h">
				<article class="card">
					<h3 id="invite-h" class="card-title">Invite Admin</h3>
					<form id="inviteForm">
						<div class="field">
							<label for="inviteEmail">Email</label>
							<input id="inviteEmail" type="email" placeholder="name@school.org" required autocomplete="email" />
						</div>
						<div class="field">
							<label for="schoolSel">School</label>
							<select id="schoolSel" required></select>
						</div>
						<div class="field">
							<label for="roleSel">Role</label>
							<select id="roleSel">
								<option value="admin">Admin</option>
							</select>
						</div>
									<div class="mt-8">
							<button class="btn btn-primary" type="submit">Send Invite</button>
						</div>
					</form>
								<p class="muted small mt-8">Note: This page is a stub. Actions will call Cloud Functions once deployed.</p>
				</article>
			</section>
		</div>
	</main>
</body>
</html>
