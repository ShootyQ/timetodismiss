<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Time To Dismiss — Roster Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="/styles.css?v=2025-09-06-MC4" />
  <link rel="preconnect" href="https://www.gstatic.com" />
  <script src="/site-header.js?v=2025-09-10-HDR4" defer></script>
  <style>
    .rm-main{ padding:18px 0 28px; }
    .titlebar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; border-bottom:1px solid #e5e7eb; padding-bottom:10px; }
    .title-actions{ display:flex; align-items:center; gap:8px; }
    .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0 14px; }
    .toolbar input, .toolbar select{ border:1px solid #e5e7eb; border-radius:10px; padding:.55rem .7rem; }
    /* Layout: form now full width above table */
    .stack{ display:flex; flex-direction:column; gap:16px; }
    .card{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px 16px; }
  .table{ width:100%; border-collapse:separate; border-spacing:0; background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; }
    .table th, .table td{ padding:.6rem .75rem; text-align:left; }
    .table thead th{ background:#f8fafc; font-weight:700; font-size:.9rem; color:#334155; border-bottom:1px solid #e5e7eb; }
    .table tbody tr + tr td{ border-top:1px solid #f1f5f9; }
    .muted{ color:var(--muted); }
    .chip{ display:inline-flex; align-items:center; gap:6px; background:#f1f5f9; color:#334155; border:1px solid #e5e7eb; border-radius:999px; padding:.1rem .5rem; font-weight:700; font-size:.75rem; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; }
    .field{ display:flex; flex-direction:column; gap:6px; margin:8px 0; }
    .field input, .field select, .field textarea{ border:1px solid #e5e7eb; border-radius:10px; padding:.55rem .7rem; }
    .btn-sm{ padding:.5rem .7rem; border-radius:10px; font-weight:700; }
    .small{ color:var(--muted); }
  .ml-auto{ margin-left:auto; }
  .t-sm-title{ font-size:1rem; }
  /* Multi-add rows */
  .rows-toolbar{ display:flex; gap:8px; align-items:center; margin:6px 0 10px; }
  .student-rows{ display:flex; flex-direction:column; gap:10px; }
  .student-row{ display:grid; grid-template-columns: 1fr 1fr 1fr 0.9fr 0.9fr 0.9fr 0.9fr auto; gap:10px; align-items:end; }
  .student-row .field{ margin:0; }
  .row-actions{ display:flex; align-items:center; gap:6px; padding-bottom:6px; }
  @media (max-width: 1400px){ .student-row{ grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr; } }
  @media (max-width: 1100px){ .student-row{ grid-template-columns: 1fr 1fr 1fr; } }
  @media (max-width: 800px){ .student-row{ grid-template-columns: 1fr 1fr; } }
  .field input, .field select{ width:100%; min-width:0; }
  #tenantInfo{ margin-left:8px; color: var(--muted); }
  .grid-scroll{ overflow:auto; }
  .nowrap{ white-space:nowrap; }
  .mono-small{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.7rem; letter-spacing:.5px; }
  .col-group{ display:flex; flex-wrap:wrap; gap:8px; }
  /* Inline modal (dialog mimic) */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:saturate(140%) blur(2px); display:none; align-items:flex-start; justify-content:center; padding:5vh 20px; z-index:400; overflow:auto; }
  .modal-backdrop.show{ display:flex; animation:fadeIn .18s ease; }
  /* Re-enable pointer events (global stylesheet disables overlays by default) */
  .modal-backdrop.show{ pointer-events:auto !important; }
  .modal-panel{ background:#fff; border-radius:16px; width:100%; max-width:880px; padding:24px 26px 30px; box-shadow:0 10px 28px -6px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.05); position:relative; }
  .modal-panel h2{ margin-top:0; font-size:1.35rem; }
  .modal-close{ position:absolute; top:10px; right:10px; border:none; background:transparent; font-size:1.2rem; cursor:pointer; line-height:1; padding:4px 8px; border-radius:8px; }
  .modal-close:hover{ background:#f1f5f9; }
  .btn-danger{ background:#dc2626; color:#fff; }
  .btn-danger:hover{ background:#b91c1c; color:#fff; }
  .del-confirm-wrap{ display:flex; gap:6px; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }
  .edit-grid{ display:grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap:14px 16px; margin:6px 0 4px; }
  .edit-grid .field{ margin:0; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; align-items:center; }
  .separator-line{ height:1px; background:#e5e7eb; margin:18px 0 12px; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  /* Family student picker */
  .fam-picker{ display:flex; flex-direction:column; gap:6px; position:relative; }
  .fam-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .fam-chip{ background:#f1f5f9; border:1px solid #e2e8f0; padding:4px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; font-size:.65rem; font-weight:600; }
  .fam-chip button{ background:transparent; border:none; cursor:pointer; font-size:.9em; line-height:1; padding:0 2px; color:#334155; }
  .fam-chip button:hover{ color:#b91c1c; }
  .fam-suggest{ list-style:none; margin:0; padding:4px 0; position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #e2e8f0; border-radius:10px; box-shadow:0 6px 14px -4px rgba(0,0,0,.15); z-index:50; max-height:220px; overflow:auto; }
  .fam-suggest li{ padding:6px 10px; font-size:.75rem; display:flex; justify-content:space-between; gap:12px; cursor:pointer; }
  .fam-suggest li:hover, .fam-suggest li[aria-selected="true"]{ background:#f1f5f9; }
  .fam-suggest-tag{ font-weight:700; letter-spacing:.5px; }
  .fam-suggest-name{ flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fam-suggest-empty{ padding:6px 10px; font-size:.7rem; color:var(--muted); }
  </style>
</head>
<body class="sd-body">
  <main class="container rm-main">
    <header class="titlebar">
      <h1 class="page-title">Roster Manager</h1>
      <div class="title-actions">
        <span id="ctxSchool" class="chip" title="Current school">—</span>
  <a href="/import.html" class="btn btn-outline" aria-label="Go to Import">Import CSV</a>
  <span id="tenantInfo" class="small"></span>
      </div>
    </header>

    <section class="toolbar" aria-label="Roster tools">
      <label class="sr-only" for="entitySel">Entity</label>
      <select id="entitySel" aria-label="Select entity">
        <option value="students">Students</option>
        <option value="classes">Classes</option>
        <option value="families">Ride Share</option>
      </select>
      <label class="sr-only" for="search">Search</label>
      <input id="search" placeholder="Search…" inputmode="search" autocomplete="off" />
      <span id="counts" class="small">—</span>
  <span id="toast" class="small ml-auto"></span>
    </section>

    <section class="stack">
      <form id="addForm" class="card" aria-labelledby="add-h">
        <h2 id="add-h" class="page-title t-sm-title">Add</h2>
        <div id="formFields"></div>
        <div class="actions">
          <button id="addBtn" type="submit" class="btn btn-primary">Add</button>
          <button id="clearBtn" type="button" class="btn btn-ghost">Clear</button>
        </div>
        <p class="small" id="hint">Select an entity to add items to your roster.</p>
      </form>
      <div class="card grid-scroll">
        <table class="table" aria-label="Roster list">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Student Edit Modal -->
  <div id="studentEditModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="studentEditTitle" aria-hidden="true">
    <div class="modal-panel" role="document">
      <button class="modal-close" type="button" aria-label="Close" data-edit-close>&times;</button>
      <h2 id="studentEditTitle">Edit Student</h2>
      <form id="studentEditForm" novalidate>
        <div id="studentEditFields" class="edit-grid"></div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" id="studentSaveBtn">Save</button>
          <button type="button" class="btn btn-ghost" data-edit-close>Cancel</button>
          <span class="small" id="editHint">Update the student details then Save.</span>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
  import { init, onAuthChanged, colPath, docPath, getClasses, onCarGroups } from '/app.js?v=23';
    await init();
  import { onSnapshot, addDoc, setDoc, deleteDoc, getDoc, getDocs, serverTimestamp, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js';

    // UI refs
    const entitySel = document.getElementById('entitySel');
    const searchIn  = document.getElementById('search');
    const thead     = document.getElementById('thead');
    const tbody     = document.getElementById('tbody');
    const counts    = document.getElementById('counts');
    const toast     = document.getElementById('toast');
    const form      = document.getElementById('addForm');
    const formFields= document.getElementById('formFields');
    const addBtn    = document.getElementById('addBtn');
    const clearBtn  = document.getElementById('clearBtn');
    const ctxSchool = document.getElementById('ctxSchool');
  const titleEl   = document.getElementById('add-h');
  const toolbar   = document.querySelector('.toolbar');

  // Class filter UI (inserted dynamically into toolbar)
  const classSel = document.createElement('select');
  classSel.id = 'classSel';
  classSel.ariaLabel = 'Filter by class';
  classSel.style.minWidth = '200px';
  classSel.style.display = 'none'; // only shown for Students
  toolbar.insertBefore(classSel, counts);

    function setToast(msg, isErr=false){
      toast.textContent = msg || '';
      toast.style.color = isErr ? '#b91c1c' : 'var(--muted)';
      if (msg) setTimeout(()=>{ if (toast.textContent === msg) toast.textContent = ''; }, 3200);
    }
  function updateCtx(){ const name = window.SD && (window.SD.schoolName || window.SD.schoolId); if (ctxSchool) ctxSchool.textContent = name || '—'; renderBody(); }
  function updateTenantInfo(){ const el = document.getElementById('tenantInfo'); if (!el) return; const org = window.SD?.orgId || '—'; const sch = window.SD?.schoolId || '—'; el.textContent = `org:${org} • school:${sch}`; }
    document.addEventListener('sd:school-changed', updateCtx);
    document.addEventListener('sd:claims-ready', updateCtx);
  document.addEventListener('sd:school-changed', updateTenantInfo);
  document.addEventListener('sd:claims-ready', updateTenantInfo);

    // Wait for tenant (orgId + schoolId)
    async function waitTenant(maxMs=15000){
      if (window.SD?.orgId && window.SD?.schoolId) return;
      let resolved = false;
      await new Promise((res, rej) => {
        const onReady = () => { if (!resolved && window.SD?.orgId && window.SD?.schoolId){ resolved = true; cleanup(); res(); } };
        function cleanup(){ try{ document.removeEventListener('sd:claims-ready', onReady); }catch{} try{ clearInterval(iv); }catch{} try{ clearTimeout(to); }catch{} }
        document.addEventListener('sd:claims-ready', onReady, { once:true });
        const iv = setInterval(onReady, 50);
        const to = setTimeout(()=>{ if(!resolved){ cleanup(); rej(new Error('tenant not ready')); } }, Math.max(1000, maxMs));
      }).catch(()=>{});
    }

    // State
  let unsub = () => {};
  let classes = [];
    let rows = [];
    let filter = '';
  let editingId = null; // students: current docId being edited
  let classFilter = '';
  // Students cache for name->tag resolution (lazy)
  let studentsCache = null; // array of { id, firstName, lastName, preferredName, name, carTag, studentId, displayName }
  let studentsCacheLoading = false;

    const headersMap = {
      students: ['Preferred / Name','ID','Class','Tag','Bus','Lane','Updated',''],
      classes:  ['Order','Class ID','Name',''],
      families: ['Ride Share ID','Name','Tags','']
    };

    function renderHead(){
  const cols = headersMap[entitySel.value] || [];
      thead.innerHTML = cols.map(c => `<th>${c}</th>`).join('');
    }

  function renderBody(){
      const e = entitySel.value;
      const q = filter.toLowerCase();
      // base filtered by search
      let list = rows.filter(r => {
        const hay = (e === 'students')
          ? `${r.name||''} ${r.studentId||''} ${r.classId||''} ${r.carTag||''}`
          : (e === 'classes')
            ? `${r.id||''} ${r.name||r.title||''}`
            : `${r.id||''} ${r.name||''} ${(r.tags||[]).join(' ')}`;
        return hay.toLowerCase().includes(q);
      });
      // apply class filter for students
      if (e === 'students' && classFilter) {
        list = list.filter(r => (r.classId||'') === classFilter);
      }
      // sort: when viewing all students, group by class name then name
      if (e === 'students' && !classFilter) {
        list = list.slice().sort((a,b) => {
          const ca = (resolveClassName(a.classId) || '').localeCompare(resolveClassName(b.classId) || '');
          if (ca !== 0) return ca;
          return (a.name||'').localeCompare(b.name||'');
        });
      }
      counts.textContent = `${list.length} item(s)`;
      if (e === 'students' && list.length === 0) {
        const org = (window.SD && window.SD.orgId) || '—';
        const sch = (window.SD && window.SD.schoolId) || '—';
        counts.textContent = `${list.length} item(s) — org:${org} • school:${sch}`;
      }
      tbody.innerHTML = '';
      list.forEach(r => {
        const tr = document.createElement('tr');
        if (e === 'students'){
            const tag = r.carTag || '';
            const display = r.displayName || r.name || '';
            tr.innerHTML = `
              <td>${escapeHtml(display)}</td>
              <td class="mono-small">${escapeHtml(r.studentId||'')}</td>
              <td>${escapeHtml(resolveClassName(r.classId)||r.classId||'')}</td>
              <td>${escapeHtml(tag||'')}</td>
              <td class="mono-small">${escapeHtml(r.busId||'')}</td>
              <td class="mono-small">${escapeHtml(r.laneId||'')}</td>
              <td class="mono-small">${escapeHtml(r._updated||'')}</td>
              <td class="actions">
                <button class="btn btn-sm" data-edit="${r._docId}">Edit</button>
                <button class="btn btn-sm btn-outline" data-del="${r._docId}">Delete</button>
              </td>
            `;
        } else if (e === 'classes'){
          tr.innerHTML = `
            <td class="mono-small">${escapeHtml(r.order === undefined || r.order === null ? '' : r.order)}</td>
            <td>${escapeHtml(r.id)}</td>
            <td>${escapeHtml(r.name||r.title||'')}</td>
            <td class="actions">
              <button class="btn btn-sm" data-edit="${r.id}">Edit</button>
              <button class="btn btn-sm btn-outline" data-del="${r.id}">Delete</button>
            </td>
          `;
        } else {
          tr.innerHTML = `
            <td>${escapeHtml(r.id)}</td>
            <td>${escapeHtml(r.name||'')}</td>
            <td>${escapeHtml((r.tags||[]).join(' '))}</td>
            <td class="actions">
              <button class="btn btn-sm" data-edit="${r.id}">Edit</button>
              <button class="btn btn-sm btn-outline" data-del="${r.id}">Delete</button>
            </td>
          `;
        }
        tbody.appendChild(tr);
      });
    }

    function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

    async function ensureStudentsCache(){
      if (studentsCache || studentsCacheLoading) return;
      studentsCacheLoading = true;
      try {
        await waitTenant().catch(()=>{});
        const qy = query(colPath('students'), orderBy('name','asc'));
        const snap = await getDocs(qy);
        studentsCache = snap.docs.map(d => {
          const data = d.data()||{};
          const first = data.firstName||''; const last = data.lastName||''; const pref = data.preferredName||'';
          const baseFull = (first||last) ? (first + (last?(' '+last):'')) : (data.name||'');
          let composite = baseFull;
          if (pref && pref.trim()){
            if (baseFull && pref.trim().toLowerCase() !== baseFull.trim().toLowerCase()) composite = `${pref} (${baseFull})`; else composite = pref;
          }
          return {
            _docId: d.id,
            firstName:first,
            lastName:last,
            preferredName:pref,
            name:data.name||'',
            displayName: composite,
            carTag: (data.carTag||data.tag||'').toString().toUpperCase(),
            studentId: data.id || ''
          };
        });
      } catch(e){ console.warn('[families] student cache load failed', e); studentsCache = []; }
      finally { studentsCacheLoading = false; }
    }

    function renderForm(){
      const e = entitySel.value;
      if (e === 'students'){
        const classOpts = classes.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name||c.id)}</option>`).join('');
        if (editingId){
          // Edit mode: structured fields
          formFields.innerHTML = `
            <div class="col-group">
              <div class="field" style="flex:1 1 180px; min-width:160px;"><label for="firstName">First Name</label><input id="firstName" autocomplete="given-name" /></div>
              <div class="field" style="flex:1 1 180px; min-width:160px;"><label for="lastName">Last Name</label><input id="lastName" autocomplete="family-name" /></div>
              <div class="field" style="flex:1 1 180px; min-width:160px;"><label for="preferredName">Preferred Name (optional)</label><input id="preferredName" autocomplete="nickname" /></div>
              <div class="field" style="flex:0 1 140px; min-width:120px;"><label for="studentId">Student ID</label><input id="studentId" inputmode="text" /></div>
              <div class="field" style="flex:0 1 160px; min-width:140px;"><label for="classId">Class</label><select id="classId">${classOpts}</select></div>
              <div class="field" style="flex:0 1 140px; min-width:120px;"><label for="carTag">Car Tag</label><input id="carTag" placeholder="e.g., A12" /></div>
              <div class="field" style="flex:0 1 120px; min-width:110px;"><label for="busId">Bus ID</label><input id="busId" placeholder="e.g., 27" /></div>
              <div class="field" style="flex:0 1 120px; min-width:110px;"><label for="laneId">Lane ID</label><input id="laneId" placeholder="e.g., N1" /></div>
            </div>
          `;
          document.getElementById('firstName')?.focus();
          titleEl.textContent = 'Edit Student';
          addBtn.textContent = 'Add';
          clearBtn.textContent = 'Cancel';
          document.getElementById('hint').textContent = 'Edit details, then submit.';
        } else {
          // Multi-add mode with structured fields per row
          formFields.innerHTML = `
            <div class="rows-toolbar">
              <button id="addRowBtn" type="button" class="btn btn-outline btn-sm" aria-label="Add another row">＋ Add row</button>
              <span class="small">Add multiple students. First & Class required. Preferred overrides display.</span>
            </div>
            <div id="studentRows" class="student-rows" aria-live="polite"></div>
          `;
          try { addStudentRow(); } catch {}
          titleEl.textContent = 'Add';
          addBtn.textContent = 'Add';
          clearBtn.textContent = 'Clear';
          document.getElementById('hint').textContent = 'Adds one or more students with status set to waiting.';
          const addRowBtn = document.getElementById('addRowBtn');
          addRowBtn?.addEventListener('click', () => addStudentRow());
        }
      } else if (e === 'classes'){
        formFields.innerHTML = `
          <div class="field"><label for="classKey">Class ID</label><input id="classKey" placeholder="e.g., G1-A" /></div>
          <div class="field"><label for="className">Name</label><input id="className" placeholder="e.g., Grade 1 - A" /></div>
          <div class="field"><label for="classOrder">Order</label><input id="classOrder" type="number" inputmode="numeric" placeholder="e.g., 10" /></div>
        `;
        const keyEl = document.getElementById('classKey');
        keyEl?.focus();
        if (editingId) {
          // In edit mode, keep ID fixed to avoid moving docs unexpectedly
          try { keyEl.setAttribute('disabled','disabled'); } catch {}
          titleEl.textContent = 'Edit Class';
          addBtn.textContent = 'Add';
          clearBtn.textContent = 'Cancel';
          document.getElementById('hint').textContent = 'Update the class name and submit.';
        } else {
          titleEl.textContent = 'Add';
          addBtn.textContent = 'Add';
          clearBtn.textContent = 'Clear';
          document.getElementById('hint').textContent = 'Creates or updates a class with the given ID and name.';
        }
      } else {
        formFields.innerHTML = `
          <div class="field"><label for="famId">Ride Share ID</label><input id="famId" placeholder="e.g., smith" /></div>
          <div class="field"><label for="famName">Ride Share Name</label><input id="famName" placeholder="e.g., Smith Ride Share" /></div>
          <div class="field"><label for="famTags">Tags</label><input id="famTags" placeholder="e.g., K4 A2 T3" aria-describedby="tagsHelp" /></div>
          <div id="tagsHelp" class="small">Separate tags by space or comma. Tags will be uppercased.</div>
          <div class="field fam-picker" style="margin-top:6px;">
            <label for="famStudentSearch">Add Student Tags</label>
            <input id="famStudentSearch" placeholder="Type name or ID…" autocomplete="off" />
            <ul id="famSuggest" class="fam-suggest" hidden></ul>
            <div class="fam-chips" id="famStudentChips" aria-live="polite"></div>
            <div class="small" id="famStudentsHelp">Type to find a student; selecting adds their car tag. Remove chips to undo.</div>
          </div>
        `;
        const idEl = document.getElementById('famId');
        idEl?.focus();
        if (editingId) {
          try { idEl.setAttribute('disabled','disabled'); } catch {}
          titleEl.textContent = 'Edit Ride Share';
          addBtn.textContent = 'Add';
          clearBtn.textContent = 'Cancel';
          document.getElementById('hint').textContent = 'Update the ride share and submit.';
        } else {
          titleEl.textContent = 'Add';
          addBtn.textContent = 'Add';
          clearBtn.textContent = 'Clear';
          document.getElementById('hint').textContent = 'Creates or updates a ride share group with one or more tags.';
        }
        initFamilyStudentPicker();
      }
    }

    // Build class option HTML, with optional selected value
    function getClassOptionsHtml(selectedId=''){
      return classes.map(c => {
        const val = String(c.id);
        const sel = (val === String(selectedId)) ? ' selected' : '';
        return `<option value="${escapeHtml(val)}"${sel}>${escapeHtml(c.name||c.id)}</option>`;
      }).join('');
    }

    let rowSeq = 0;
    function addStudentRow(pref={}){
      const rowsHost = document.getElementById('studentRows');
      if (!rowsHost) return;
      rowSeq++;
      const idx = rowSeq;
      const row = document.createElement('div');
      row.className = 'student-row';
      row.setAttribute('data-idx', String(idx));
      row.innerHTML = `
        <div class="field"><label for="firstName_${idx}">First</label><input id="firstName_${idx}" name="firstName" autocomplete="given-name" value="${escapeHtml(pref.firstName||'')}" /></div>

    async function subscribe(){
      await waitTenant().catch(()=>{});
      try { unsub(); } catch {}
      rows = [];
      renderHead();
      renderBody();
      const e = entitySel.value;
      if (e === 'students'){
        const qy = query(colPath('students'), orderBy('name','asc'));
        unsub = onSnapshot(qy, (snap) => {
          rows = snap.docs.map(d => {
            const data = d.data() || {};
            const first = data.firstName || '';
            const last = data.lastName || '';
            const pref = data.preferredName || '';
            const baseFull = (first || last) ? (first + (last?(' ' + last):'')) : (data.name||'');
            let composite = baseFull;
            if (pref && pref.trim()){
              if (baseFull && pref.trim().toLowerCase() !== baseFull.trim().toLowerCase()) composite = `${pref} (${baseFull})`; else composite = pref;
            }
            let updatedIso = '';
            try {
              let ts = null;
              if (data.updatedAt?.toDate) ts = data.updatedAt.toDate();
              else if (data.updatedAt?.toMillis) ts = new Date(data.updatedAt.toMillis());
              if (ts) updatedIso = ts.toLocaleDateString(undefined,{month:'numeric',day:'numeric'}) + ' ' + ts.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
            } catch {}
            return {
              _docId: d.id,
              name: data.name || '',
              firstName: first,
              lastName: last,
              preferredName: pref,
              displayName: composite,
              studentId: data.id || '',
              classId: data.classId || '',
              carTag: (data.carTag || data.tag || '').toString().toUpperCase(),
              busId: data.busId || '',
              laneId: data.laneId || '',
              _updated: updatedIso
            };
          });
          renderBody();
        }, (err) => { console.error('[students] listener error:', err); });
      } else if (e === 'classes'){
        // Prefer explicit numeric order, but gracefully fallback if index/permission/other error.
        const startOrderListener = () => {
          try {
            const qyOrd = query(colPath('classes'), orderBy('order','asc'));
            unsub = onSnapshot(qyOrd, (snap) => {
              rows = snap.docs.map(d=>({ id:d.id, ...d.data() }));
              // If empty but we previously had data, keep previous until fallback? For now just render.
              renderBody();
              // If we got zero docs AND no order field likely exists, we still show empty; a timeout below triggers fallback.
            }, (err) => {
              console.warn('[classes] order listener runtime error; falling back to name ordering:', err?.message||err);
              startNameListener();
            });
            // Safety fallback: if after a short delay no rows populated but we suspect existing classes from cached list
            setTimeout(() => { if (rows.length === 0) {
              try { startNameListener(); } catch {}
            } }, 2000);
          } catch (e2){
            console.warn('[classes] order query failed synchronously, fallback to name', e2?.message||e2);
            startNameListener();
          }
        };
        const startNameListener = () => {
          try {
            const qyNm = query(colPath('classes'), orderBy('name','asc'));
            try { unsub(); } catch {}
            unsub = onSnapshot(qyNm, (snap) => {
              rows = snap.docs.map(d=>({ id:d.id, ...d.data() }));
              renderBody();
            }, (err2) => console.error('[classes] name listener error:', err2));
          } catch (e3){ console.error('[classes] name fallback failed:', e3?.message||e3); }
        };
        startOrderListener();
      } else {
        unsub = onCarGroups((list) => { rows = list; renderBody(); });
      }
    }

    // Autocomplete picker for family student tag selection
    function initFamilyStudentPicker(isEdit=false){
      const input = document.getElementById(isEdit ? 'edit_famStudentSearch' : 'famStudentSearch');
      const list  = document.getElementById(isEdit ? 'edit_famSuggest' : 'famSuggest');
      const chips = document.getElementById(isEdit ? 'edit_famStudentChips' : 'famStudentChips');
      const tagsEl= document.getElementById(isEdit ? 'edit_famTags' : 'famTags');
      if (!input || !list || !chips || !tagsEl) return;
      if (input.dataset.wired) return; input.dataset.wired='1';
      const added = new Set();
      function renderChips(){
        chips.innerHTML = Array.from(added).map(tag => `<span class="fam-chip" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)} <button type="button" aria-label="Remove ${escapeHtml(tag)}">×</button></span>`).join('');
        chips.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
          const t = btn.parentElement?.getAttribute('data-tag');
          if (t){
            const parts = (tagsEl.value||'').split(/[\s,]+/).filter(Boolean);
            const next = parts.filter(p => p.toUpperCase() !== t);
            tagsEl.value = next.join(' ');
            added.delete(t);
            renderChips();
          }
        }));
      }
      function mergeIntoTags(){
        const existing = (tagsEl.value||'').split(/[\s,]+/).filter(Boolean).map(s=>s.toUpperCase());
        const merged = Array.from(new Set([...existing, ...added]));
        tagsEl.value = merged.join(' ');
      }
      function hideList(){ list.hidden = true; list.innerHTML=''; highlighted = -1; }
      let current = [];
      let highlighted = -1;
      function showSuggestions(items){
        if (!items.length){ list.innerHTML = '<li class="fam-suggest-empty">No matches</li>'; list.hidden=false; highlighted=-1; return; }
        list.innerHTML = items.slice(0,50).map((s,i)=>{
          const tag = (s.carTag||'').toString().toUpperCase();
            const label = s.displayName || s.name || (s.firstName||'');
          return `<li role="option" data-idx="${i}" aria-selected="${i===highlighted}"><span class="fam-suggest-name">${escapeHtml(label)}</span><span class="fam-suggest-tag">${escapeHtml(tag)}</span></li>`;
        }).join('');
        list.hidden = false;
        list.querySelectorAll('li[data-idx]').forEach(li => li.addEventListener('click', () => {
          const idx = parseInt(li.getAttribute('data-idx'),10); selectIdx(idx);
        }));
      }
      function updateHighlight(delta){
        if (list.hidden || !current.length) return;
        highlighted = (highlighted + delta + current.length) % current.length;
        showSuggestions(current);
      }
      function selectIdx(idx){
        const item = current[idx];
        if (item && item.carTag){ added.add(item.carTag.toUpperCase()); mergeIntoTags(); renderChips(); }
        input.value=''; hideList(); input.focus();
      }
      input.addEventListener('input', async () => {
        const q = input.value.trim().toLowerCase();
        if (!q){ hideList(); return; }
        await ensureStudentsCache();
        const hay = studentsCache || [];
        current = hay.filter(s => {
          const all = `${s.displayName||''} ${s.name||''} ${s.firstName||''} ${s.lastName||''} ${s.studentId||''}`.toLowerCase();
          return all.includes(q);
        }).slice(0,100);
        highlighted = current.length ? 0 : -1;
        showSuggestions(current);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown'){ updateHighlight(1); e.preventDefault(); }
        else if (e.key === 'ArrowUp'){ updateHighlight(-1); e.preventDefault(); }
        else if (e.key === 'Enter'){ if (!list.hidden && highlighted>=0){ e.preventDefault(); selectIdx(highlighted); } }
        else if (e.key === 'Escape'){ hideList(); }
      });
      document.addEventListener('click', (e) => { if (!list.contains(e.target) && e.target !== input){ hideList(); } });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const ent = entitySel.value;
      try {
        if (ent === 'students'){
          const rowsHost = document.getElementById('studentRows');
          if (editingId || !rowsHost){
            // Single-row path (edit mode)
            const firstName    = (document.getElementById('firstName')?.value||'').trim();
            const lastName     = (document.getElementById('lastName')?.value||'').trim();
            const preferredName= (document.getElementById('preferredName')?.value||'').trim();
            const idVal        = (document.getElementById('studentId')?.value||'').trim();
            const classId      = (document.getElementById('classId')?.value||'').trim();
            const carTag       = (document.getElementById('carTag')?.value||'').trim().toUpperCase();
            const busId        = (document.getElementById('busId')?.value||'').trim();
            const laneId       = (document.getElementById('laneId')?.value||'').trim();
            if (!firstName && !preferredName) return setToast('First or Preferred name required.', true);
            if (!classId) return setToast('Class is required.', true);
            // Maintain legacy 'name' for now (preferred > first+last)
            const legacyName = preferredName || [firstName,lastName].filter(Boolean).join(' ') || firstName || lastName;
            const payload = { firstName, lastName, preferredName, name: legacyName, id: idVal, classId, carTag, busId, laneId, updatedAt: serverTimestamp() };
            if (editingId){
              await setDoc(docPath('students', editingId), payload, { merge: true });
              setToast('Student updated.');
              exitEditMode();
            } else {
              payload.status = 'waiting';
              payload.createdAt = serverTimestamp();
              await addDoc(colPath('students'), payload);
              setToast('Student added.');
              form.reset();
              renderForm();
            }
          } else {
            // Batch add path (multi-rows)
            const rows = Array.from(rowsHost.querySelectorAll('.student-row'));
            const toCreate = [];
            for (const row of rows){
              const firstName      = (row.querySelector('input[name="firstName"]')?.value||'').trim();
              const lastName       = (row.querySelector('input[name="lastName"]')?.value||'').trim();
              const preferredName  = (row.querySelector('input[name="preferredName"]')?.value||'').trim();
              const id        = (row.querySelector('input[name="studentId"]')?.value||'').trim();
              const classId   = (row.querySelector('select[name="classId"]')?.value||'').trim();
              const carTag    = (row.querySelector('input[name="carTag"]')?.value||'').trim().toUpperCase();
              const busId     = (row.querySelector('input[name="busId"]')?.value||'').trim();
              const laneId    = (row.querySelector('input[name="laneId"]')?.value||'').trim();
              // Skip completely empty rows
              const hasAny = firstName || preferredName || id || classId || carTag || lastName || busId || laneId;
              if (!hasAny) continue;
              if (!firstName && !preferredName) return setToast('Name (First or Preferred) required each row.', true);
              if (!classId) return setToast('Class is required for each filled row.', true);
              const legacyName = preferredName || [firstName,lastName].filter(Boolean).join(' ') || firstName || lastName;
              toCreate.push({ firstName, lastName, preferredName, name: legacyName, id, classId, carTag, busId, laneId, status:'waiting', createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
            }
            if (toCreate.length === 0){ setToast('Nothing to add. Fill at least one row.', true); return; }
            await Promise.all(toCreate.map(p => addDoc(colPath('students'), p)));
            setToast(`Added ${toCreate.length} student(s).`);
            form.reset();
            renderForm();
          }
        } else if (ent === 'classes'){
          const keyEl = document.getElementById('classKey');
          const nameEl = document.getElementById('className');
          const orderEl = document.getElementById('classOrder');
          const key  = (keyEl?.value||'').trim();
          const name = (nameEl?.value||'').trim();
          const orderRaw = (orderEl?.value||'').trim();
          if (!key) return setToast('Class ID is required.', true);
          const payload = { id: key, name: name || key, title: name || key, updatedAt: serverTimestamp() };
          if (orderRaw !== ''){
            const ord = parseInt(orderRaw,10);
            if (!isNaN(ord)) payload.order = ord;
          }
          if (editingId){
            await setDoc(docPath('classes', editingId), payload, { merge: true });
            setToast('Class updated.');
            try { keyEl?.removeAttribute('disabled'); } catch {}
            exitEditMode();
          } else {
            payload.createdAt = serverTimestamp();
            await setDoc(docPath('classes', key), payload, { merge: true });
            setToast('Class saved.');
            form.reset();
          }
        } else {
          const idEl = document.getElementById('famId');
          const nmEl = document.getElementById('famName');
          const tgEl = document.getElementById('famTags');
          const id   = (idEl?.value||'').trim();
          const name = (nmEl?.value||'').trim();
          const tags = (tgEl?.value||'').split(/[\s,]+/).filter(Boolean).map(s=>s.toUpperCase());
          if (!id) return setToast('Ride share ID is required.', true);
          const payload = { id, name: name || id, tags, updatedAt: serverTimestamp() };
          if (editingId){
            await setDoc(docPath('carGroups', editingId), payload, { merge: true });
            setToast('Ride share updated.');
            try { idEl?.removeAttribute('disabled'); } catch {}
            exitEditMode();
          } else {
            payload.createdAt = serverTimestamp();
            await setDoc(docPath('carGroups', id), payload, { merge: true });
            setToast('Ride share saved.');
            form.reset();
          }
        }
      } catch (err){ console.error(err); setToast('Save failed: ' + (err?.message||'Unknown'), true); }
    });

    // Auth guard: require sign-in
    onAuthChanged((user) => {
      if (!user){ try { location.replace('/index.html#login'); } catch { location.href = '/index.html#login'; } }
    });

    // Boot
  await refreshClasses();
  renderForm();
  subscribe();
  </script>
</body>
</html>
