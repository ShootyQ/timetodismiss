<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time To Dismiss — Preferences</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/site-header.js" defer></script>
  <style>
    main.prefs-main{ padding:28px 0 40px; }
    .pref-card{ background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px 20px; margin:0 0 24px; box-shadow:0 3px 10px -2px rgba(15,23,42,.06); }
    .pref-card h2{ margin:0 0 12px; font-size:1.05rem; font-weight:800; }
    .classes-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:8px 12px; margin:12px 0 4px; }
    .classes-grid label{ display:flex; align-items:center; gap:8px; padding:6px 10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; cursor:pointer; font-size:.9rem; line-height:1.2; font-weight:600; }
    .classes-grid label input{ width:18px; height:18px; }
    .actions-row{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px; }
    .save-row{ display:flex; align-items:center; gap:12px; margin-top:12px; }
    .status-msg{ font-size:.8rem; font-weight:600; }
    .status-ok{ color:#059669; }
    .status-warn{ color:#b45309; }
    .status-err{ color:#dc2626; }
    .pill{ display:inline-block; padding:2px 8px 3px; background:#e2e8f0; color:#334155; border-radius:999px; font-size:.65rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
    @media (max-width:700px){ .classes-grid{ grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); } }
  </style>
</head>
<body class="sd-body">
  <main class="container prefs-main" id="prefsRoot">
    <h1 style="margin:0 0 1rem; font-size:1.4rem; font-weight:900;">Preferences</h1>
    <div id="userIdent" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 18px;">
      <div class="small" id="userEmailBox" style="font-weight:600; color:#334155;">&nbsp;</div>
      <div id="schoolSelectWrap" style="display:none; align-items:center; gap:6px;">
        <label for="prefSchoolSel" class="small" style="font-weight:700;">School:</label>
        <select id="prefSchoolSel" class="btn" style="padding:.4rem .65rem; border:1px solid #cbd5e1; background:#fff; border-radius:10px; font-size:.8rem; font-weight:600;"></select>
        <span id="schoolStatus" class="small" style="color:#64748b;"></span>
      </div>
    </div>

  <section class="pref-card" id="favClassesCard" aria-live="polite">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <h2 style="display:flex; align-items:center; gap:10px;">Favorite Classes <span class="pill">Beta</span></h2>
        <div class="small" style="color:#64748b;">Auto-select these on the Class Board when no filter is set.</div>
      </div>
      <div class="actions-row" id="favActions" style="display:none;">
        <button id="favSelectAll" class="btn btn-secondary btn-sm" type="button">Select All</button>
        <button id="favClear" class="btn btn-outline btn-sm" type="button">Clear</button>
  <!-- Invert removed as requested -->
      </div>
      <div id="favClassesGrid" class="classes-grid" aria-label="Favorite classes list"></div>
      <div class="save-row">
        <button id="saveFavs" class="btn btn-primary" type="button">Save Favorites</button>
        <div id="saveStatus" class="status-msg" aria-live="polite"></div>
      </div>
    </section>

    <section class="pref-card" id="moreSoon">
      <h2>Sound Alert</h2>
      <p style="margin:0 0 10px; font-size:.85rem; line-height:1.4; color:#475569;">Choose the sound that plays when a student is called (applies to this account on this device).</p>
      <div id="soundList" role="radiogroup" aria-label="Call alert sound" style="display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));"></div>
      <div style="margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button id="saveSound" class="btn btn-primary btn-sm" type="button">Save Sound</button>
        <div id="soundStatus" class="status-msg" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { init, getClassesForSchool, getMyPrefs, setMyPrefs } from '/app.js?v=20';
    await init();

    const grid = document.getElementById('favClassesGrid');
    const btnAll = document.getElementById('favSelectAll');
    const btnClr = document.getElementById('favClear');
    const btnSave = document.getElementById('saveFavs');
    const statusEl = document.getElementById('saveStatus');
    const actionsRow = document.getElementById('favActions');
    const schoolSel = document.getElementById('prefSchoolSel');
    const schoolWrap = document.getElementById('schoolSelectWrap');
    const schoolStatus = document.getElementById('schoolStatus');
    const emailBox = document.getElementById('userEmailBox');

    // Sound preference elements
    const soundList = document.getElementById('soundList');
    const saveSoundBtn = document.getElementById('saveSound');
    const soundStatus = document.getElementById('soundStatus');
    const SOUND_OPTIONS = [
      { file:'dingdingding.mp3', label:'Ding Ding Ding' },
      { file:'catmewo.mp3', label:'Cat Meow' },
      { file:'solidsnakealert.mp3', label:'Stealth Alert' },
      { file:'videogamefail.mp3', label:'Retro Fail Chime' }
    ];
    function renderSoundOptions(current){
      if (!soundList) return;
      soundList.innerHTML = SOUND_OPTIONS.map(opt => {
        const checked = current === opt.file ? 'checked' : '';
        return `<label style="display:flex; align-items:center; gap:8px; padding:8px 10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; cursor:pointer; font-size:.8rem; font-weight:600;">
          <input type="radio" name="soundSel" value="${opt.file}" ${checked} />
          <span style="flex:1 1 auto;">${opt.label}</span>
          <button type="button" class="btn btn-xs btn-outline" data-sample="${opt.file}">Play</button>
        </label>`;
      }).join('');
    }
    function currentSound(){
      const sel = soundList?.querySelector('input[name="soundSel"]:checked');
      return sel ? sel.value : '';
    }
    soundList?.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-sample]');
      if (!btn) return;
      const f = btn.getAttribute('data-sample');
      if (!f) return;
      const a = new Audio(`/sounds/${f}`);
      a.currentTime = 0; a.play().catch(()=>{});
    });
    saveSoundBtn?.addEventListener('click', async () => {
      const file = currentSound();
      if (!file){ soundStatus.textContent='Choose a sound first'; soundStatus.className='status-msg status-warn'; return; }
      saveSoundBtn.disabled = true; soundStatus.textContent='Saving…'; soundStatus.className='status-msg';
      const res = await setMyPrefs({ sound: file });
      if (res.ok && res.localOnly){ soundStatus.textContent='Saved locally (offline)'; soundStatus.className='status-msg status-warn'; }
      else if (res.ok){ soundStatus.textContent='Saved.'; soundStatus.className='status-msg status-ok'; }
      else { soundStatus.textContent='Failed to save'; soundStatus.className='status-msg status-err'; }
      saveSoundBtn.disabled = false;
    });

    let currentSchoolId = null;
    let loading = false;

    function setStatus(text, cls){
      if (!statusEl) return; statusEl.textContent = text || ''; statusEl.className = 'status-msg ' + (cls || '');
    }

    async function loadSchoolsFromClaims(){
      try {
        const claims = (window.SD && window.SD.claims) || {};
        emailBox.textContent = (claims.email || (window.firebase?.auth?.()?.currentUser?.email)) || '';
        const sids = Array.isArray(claims.schoolIds) ? claims.schoolIds.slice() : (claims.schoolId ? [claims.schoolId] : []);
        const orgIds = Array.isArray(claims.orgIds) ? claims.orgIds.slice() : (claims.orgId ? [claims.orgId] : []);
        if (sids.length > 1) {
          schoolSel.innerHTML='';
          sids.forEach(id => { const opt = document.createElement('option'); opt.value=id; opt.textContent=id; schoolSel.appendChild(opt); });
          schoolWrap.style.display='flex';
          currentSchoolId = sids[0];
        } else {
          currentSchoolId = sids[0] || window.SD?.schoolId || null;
        }
        return { schoolIds: sids, orgIds };
      } catch { return { schoolIds: [], orgIds: [] }; }
    }

    async function loadClassesAndPrefs(){
      if (!currentSchoolId) { setStatus('No school context','status-warn'); return; }
      if (loading) return; loading = true;
      setStatus('Loading classes…'); actionsRow.style.display='none'; grid.innerHTML='';
      try {
        const classes = await getClassesForSchool(currentSchoolId).catch(()=>[]);
        if (!classes.length) { setStatus('No classes found','status-warn'); loading=false; return; }
        const prefs = await getMyPrefs(currentSchoolId).catch(()=>({ favoriteClasses: [] }));
        const favSet = new Set(prefs.favoriteClasses || []);
        classes.sort((a,b)=> (a.name||a.id).localeCompare(b.name||b.id));
        grid.innerHTML = classes.map(c => {
          const checked = favSet.has(c.id) ? 'checked' : '';
          return `<label><input type="checkbox" value="${c.id}" ${checked} /> <span>${c.name || c.id}</span></label>`;
        }).join('');
        actionsRow.style.display='flex';
        if (prefs._local) setStatus('Loaded (local only)','status-warn'); else setStatus('Loaded.','status-ok');
        // Load global sound preference once
        try {
          const gp = await getMyPrefs().catch(()=>({}));
          renderSoundOptions(gp.sound || '');
        } catch { renderSoundOptions(''); }
      } catch (e) {
        setStatus('Failed: '+(e.message||'error'),'status-err');
      } finally { loading=false; }
    }

    function currentSelection(){
      return Array.from(grid.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
    }
    function setSelection(ids){
      const set = new Set(ids);
      grid.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = set.has(cb.value); });
    }

    btnAll?.addEventListener('click', () => {
      const all = Array.from(grid.querySelectorAll('input[type="checkbox"]')).map(cb => cb.value); setSelection(all);
    });
    btnClr?.addEventListener('click', () => setSelection([]));

    btnSave?.addEventListener('click', async () => {
      const favs = currentSelection();
      setStatus('Saving…'); btnSave.disabled = true;
      const res = await setMyPrefs({ favoriteClasses: favs }, currentSchoolId);
      if (res.ok && res.localOnly) setStatus('Saved locally (offline)','status-warn');
      else if (res.ok) setStatus('Saved.','status-ok');
      else setStatus('Failed to save','status-err');
      btnSave.disabled = false;
    });

    schoolSel?.addEventListener('change', () => {
      currentSchoolId = schoolSel.value || null;
      schoolStatus.textContent = 'Loading…';
      loadClassesAndPrefs().then(()=>{ schoolStatus.textContent=''; });
    });

    async function initPage(){
      await loadSchoolsFromClaims();
      await loadClassesAndPrefs();
    }

    if (window.SD?.claims) initPage();
    else document.addEventListener('sd:claims-ready', initPage, { once:true });
  </script>
</body>
</html>
