<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time To Dismiss — Classic (Redirected)</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="/styles.css?v=2025-09-07-MC7" />
  <link rel="preconnect" href="https://www.gstatic.com" />
  <!-- Header sets up Firebase + emits claims events -->
  <script src="/site-header.js?v=2025-10-13-HDR5" defer></script>

  <!-- Safety pin: make sure nothing blocks clicks -->
  <style>
    #qrSheet[hidden]{display:none!important}
    button, a.btn, select, input { pointer-events:auto!important }
  </style>
</head>
<body class="sd-body">
  <main class="container" style="padding:20px 0 40px;">
    <h1 class="page-title page-title-tight">Classic moved to Tiles</h1>
    <p class="small muted" id="redirMsg">You’ll be redirected to the new Tiles view in a moment…</p>
    <div style="margin:14px 0 10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <a id="gotoTiles" class="btn btn-primary" href="/mastercaller.html">Go to Tiles now</a>
      <a id="gotoHub" class="btn btn-outline" href="/callerhub.html">Caller Hub</a>
    </div>
    <p class="small muted">If you need to stay on this page temporarily, add <code>?stay=1</code> to the URL.</p>
  </main>

  <div id="qrSheet" hidden class="qr-sheet"></div>

  <script type="module">
    const url = new URL(location.href);
    if (url.searchParams.get('stay') !== '1') {
      const to = new URL('/mastercaller.html', location.origin);
      const s = url.searchParams.get('session');
      if (s) to.searchParams.set('session', s);
      // Small delay so users read the banner
      setTimeout(() => { location.replace(to.toString()); }, 1200);
    } else {
      const s = url.searchParams.get('session');
      const tiles = document.getElementById('gotoTiles');
      if (s && tiles) tiles.href = '/mastercaller.html?session=' + encodeURIComponent(s);
      const hub = document.getElementById('gotoHub');
      if (s && hub) hub.href = '/callerhub.html?session=' + encodeURIComponent(s);
      document.getElementById('redirMsg').textContent = 'Auto-redirect disabled via ?stay=1.';
    }
  </script>
</body>
</html>
