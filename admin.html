<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time To Dismiss — Admin</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="/styles.css?v=2025-09-06-MC4" />
  <link rel="preconnect" href="https://www.gstatic.com" />
  <script src="/site-header.js?v=2025-09-10-HDR4" defer></script>
  <style>
    .admin-main{ padding:18px 0 28px; }
    .titlebar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; border-bottom:1px solid #e5e7eb; padding-bottom:10px; }
    .titlebar .page-title{ margin:0; font-size:1.4rem; font-weight:800; }
    .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .muted{ color:var(--muted); }
    .small{ font-size:.95rem; }
    .grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:12px; }
    .mt-2{ margin-top:.5rem; }
    .mt-8{ margin-top:8px; }
    .mt-12{ margin-top:12px; }
  </style>
  </head>
<body class="sd-body">
  <main class="container admin-main">
    <header class="titlebar">
      <h1 class="page-title">Admin Dashboard</h1>
      <span id="roleBadge" class="muted small">Restricted</span>
    </header>

    <p id="gateMsg" class="small muted">Checking access…</p>

    <div id="portal" hidden>
      <section class="grid" aria-labelledby="overview-h">
        <article class="card pad" aria-live="polite">
          <h3 id="overview-h" class="card-title">Your School</h3>
          <div class="row small muted"><span>Org:</span> <strong id="orgId">—</strong></div>
          <div class="row small muted"><span>School:</span> <strong id="schoolId">—</strong></div>
          <p class="small muted mt-2">Admins manage roster, classes, and operations. Adding schools is superintendent-only.</p>
        </article>

        <article class="card pad">
          <h3 class="card-title">Quick actions</h3>
          <div class="row mt-8">
            <a class="btn btn-primary" href="/manage.html" title="Manage Students, Classes, and Ride Shares">Manage Student Roster, Classes, and Ride Shares</a>
            <a class="btn btn-primary" href="/qr-codes.html">QR Codes</a>
            <a class="btn btn-primary" href="/roles.html">Manage Staff Roles</a>
          </div>
        </article>
      </section>

      
    </div>
  </main>

  <script>
    function readyFirebase(){ return window.firebase && firebase.apps && firebase.apps.length; }

    function setText(id, val){ const el = document.getElementById(id); if(el) el.textContent = val || '—'; }

    async function requireAdmin(){
      const gate = document.getElementById('gateMsg');
      const portal = document.getElementById('portal');
      if(!readyFirebase()){
        gate.textContent = 'Loading…';
        let tries = 0;
        return new Promise((resolve)=>{
          const iv = setInterval(()=>{ if(readyFirebase() || tries++ > 80){ clearInterval(iv); resolve(); } }, 100);
        }).then(()=>requireAdmin());
      }

      const auth = firebase.auth();
      auth.onAuthStateChanged(async (user) => {
        if(!user){ gate.textContent = 'Sign in required.'; portal.hidden = true; return; }
        try{
          // Wait for claims from site-header
          const onClaims = (e) => initWithClaims(e?.detail?.claims || {});
          document.addEventListener('sd:claims-ready', onClaims, { once: true });
          // In case event already fired, fallback to direct token
          const tok = await user.getIdTokenResult(true).catch(()=>null);
          if(tok && tok.claims) initWithClaims(tok.claims);
        }catch(e){ gate.textContent = 'Error loading permissions.'; portal.hidden = true; console.error(e); }
      });

      function initWithClaims(claims){
        if(!claims || !claims.admin){ try { location.replace('/index.html#login'); } catch { location.href = '/index.html#login'; } portal.hidden = true; return; }
        const orgIds = Array.isArray(claims.orgIds) ? claims.orgIds : [];
        const orgId = claims.orgId || orgIds[0] || '';
        const schoolId = claims.schoolId || (Array.isArray(claims.schoolIds) ? claims.schoolIds[0] : '');
        setText('orgId', orgId);
        const name = (window.SD && window.SD.schoolName) || schoolId;
        setText('schoolId', name);
        const badge = document.getElementById('roleBadge'); if (badge) badge.textContent = 'Admin';
        gate.textContent = '';
        portal.hidden = false;
        // react to school switch
        document.addEventListener('sd:school-changed', (e) => {
          const d = e?.detail || {};
          if (d.orgId) setText('orgId', d.orgId);
          if (d.schoolName || d.schoolId) setText('schoolId', d.schoolName || d.schoolId);
        });
      }
    }

    document.addEventListener('DOMContentLoaded', requireAdmin);
  </script>
</body>
</html>
