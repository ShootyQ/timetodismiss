<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time To Dismiss — Leaderboard</title>

  <link rel="stylesheet" href="/styles.css?v=2025-09-06-MC4" />
  <link rel="preconnect" href="https://www.gstatic.com" />
  <script src="/site-header.js?v=2025-10-13-HDR5" defer></script>

  <style>
    .lb-main{ padding:18px 0 28px; }
    .lb-toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:8px 0 14px; }
    .lb-toolbar select{ border:1px solid #e5e7eb; border-radius:10px; padding:.45rem .6rem; }
    .lb-sections{ display:grid; grid-template-columns:1fr; gap:18px; }
    .lb-card{ border:1px solid #e5e7eb; border-radius:14px; padding:14px; background:#fff; }
    .lb-title{ font-weight:800; font-size:1rem; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
    .lb-meta{ color:var(--muted); font-size:.85rem; }
    .lb-list{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
    .lb-row{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; padding:10px; border:1px solid #eef2f7; border-radius:12px; background:linear-gradient(180deg, #fff, #fafcff); }
    .lb-rank{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:.95rem; color:#111827; }
    .rank-1{ background:linear-gradient(45deg,#fef3c7,#fde68a); box-shadow:0 0 0 2px #f59e0b33 inset; }
    .rank-2{ background:linear-gradient(45deg,#e5e7eb,#f3f4f6); box-shadow:0 0 0 2px #9ca3af33 inset; }
    .rank-3{ background:linear-gradient(45deg,#fce7f3,#fbcfe8); box-shadow:0 0 0 2px #ec489933 inset; }
    .lb-name{ font-weight:800; letter-spacing:.2px; }
    .lb-sub{ color:#6b7280; font-size:.85rem; }
    .lb-time{ font-weight:900; font-variant-numeric: tabular-nums; }
    .lb-bar{ height:10px; border-radius:999px; background:#eef2f7; overflow:hidden; }
    .lb-bar > span{ display:block; height:100%; background:linear-gradient(90deg,#34d399,#10b981); }
    .lb-crown{ font-size:1.1rem; }
    .lb-empty{ color:var(--muted); }

    @media (min-width: 900px){ .lb-sections{ grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body class="sd-body">
  <main class="container lb-main">
    <h1 class="page-title" style="margin:0 0 6px;">Leaderboard</h1>
    <p class="small muted" id="ctxSchool">—</p>

    <div class="lb-toolbar">
      <label class="small muted">Range</label>
      <select id="range">
        <option value="today">Today</option>
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
      </select>
      <span class="lb-meta" id="lbMeta">Loading…</span>
    </div>

    <section class="lb-sections">
      <div class="lb-card">
        <div class="lb-title">Top Classes — Fastest to En Route <span class="lb-crown">👑</span></div>
        <div class="lb-meta" id="classMeta">—</div>
        <ul id="classList" class="lb-list"></ul>
      </div>
      <div class="lb-card">
        <div class="lb-title">Top Students — Fastest En Route <span>🌟</span></div>
        <div class="lb-meta" id="studentMeta">—</div>
        <ul id="studentList" class="lb-list"></ul>
      </div>
    </section>
  </main>

  <script>
    // Fun confetti (loaded on demand)
    function confettiBurst(){
      try{
        if (!window.confetti){
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js';
          s.onload = ()=>{ try { window.confetti?.({ particleCount: 120, spread: 70, origin: { y: .15 } }); } catch {} };
          document.head.appendChild(s);
        } else {
          window.confetti({ particleCount: 120, spread: 70, origin: { y: .15 } });
        }
      } catch {}
    }
  </script>

  <script type="module">
  import { init, getClasses } from '/app.js?v=23';
  import { getFirestore, collection, collectionGroup, where, orderBy, limit, getDocs, query, doc } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js';
  await init();

  const ctxSchool = document.getElementById('ctxSchool');
  function updateCtx(){ const n = window.SD && (window.SD.schoolName || window.SD.schoolId); if(ctxSchool) ctxSchool.textContent = n || '—'; }
  document.addEventListener('sd:school-changed', updateCtx);
  document.addEventListener('sd:claims-ready', updateCtx);
  updateCtx();

  const rangeSel = document.getElementById('range');
  const lbMeta = document.getElementById('lbMeta');
  const classMeta = document.getElementById('classMeta');
  const studentMeta = document.getElementById('studentMeta');
  const classList = document.getElementById('classList');
  const studentList = document.getElementById('studentList');

  // Utilities
  function tsToDate(ts){ try{ return ts?.toDate?.() || null; }catch{ return null; } }
  function ms(ts){ try { return ts?.toDate?.()?.getTime?.() || 0; } catch { return 0; } }
  function fmtSec(sec){ if(sec==null) return '—'; const s=Math.round(sec); const m=Math.floor(s/60); const r=s%60; return (m>0? (m+'m '+r+'s') : (r+'s')); }

  async function buildLeaderboard(){
    const fs = getFirestore();
    const oid = window.SD?.orgId, sid = window.SD?.schoolId; if(!oid||!sid){ lbMeta.textContent='Missing org/school context'; return; }
    lbMeta.textContent='Loading…'; classMeta.textContent='—'; studentMeta.textContent='—'; classList.innerHTML=''; studentList.innerHTML='';

    // Date range → sessions
    const val = rangeSel.value;
    const now = new Date();
    let since = null; let until = null; let label = '';
    if (val === 'today'){
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      since = start; until = new Date(start.getTime() + 24*60*60*1000); label = 'Today';
    } else {
      const days = parseInt(val||'30',10); since = new Date(Date.now() - days*24*60*60*1000); until = now; label = `Last ${days} days`;
    }

    // Fetch sessions in range
    const sessQ = query(collection(fs,'orgs',oid,'schools',sid,'callSessions'), where('startedAt','>=', since), where('startedAt','<=', until), orderBy('startedAt','asc'), limit(150));
    let sessSnap; try { sessSnap = await getDocs(sessQ); } catch(e){ lbMeta.textContent='Failed to load sessions'; console.warn('[lb] sessions query failed', e); return; }
    const sessions = sessSnap.docs.map(d=>({ id:d.id, ...d.data() })).filter(s=>s.startedAt);
    if(sessions.length===0){ lbMeta.textContent = label+': no sessions'; classList.innerHTML = '<li class="lb-empty">No data</li>'; studentList.innerHTML = '<li class="lb-empty">No data</li>'; return; }

    // Build class map for display
    let classMap = {}; try { const cls = await getClasses(); classMap = Object.fromEntries((cls||[]).map(c=>[c.id, c.name||c.id])); } catch {}

    // Aggregate events per session → first called and en_route per student
    const byClass = new Map(); // classId -> { sumMs, n }
    const byStudent = new Map(); // studentId -> { name, classId, sumMs, n }

    const MAX_CONC = 4; let i=0;
    async function nextBatch(){
      const batch = sessions.slice(i, i+MAX_CONC); i += MAX_CONC;
      await Promise.all(batch.map(async (s)=>{
        try{
          const sDate = tsToDate(s.startedAt); if(!sDate) return;
          const st = sDate.getTime();
          let evSnap;
          try {
            const qy = query(collectionGroup(fs,'events'), where('orgId','==',oid), where('schoolId','==',sid), where('sessionId','==', s.id));
            evSnap = await getDocs(qy);
          } catch(e1){
            try {
              const qy2 = query(collectionGroup(fs,'events'), where('sessionId','==', s.id));
              evSnap = await getDocs(qy2);
            } catch(e2){
              // fallback: scan students under this school
              const studentsCol = collection(fs,'orgs',oid,'schools',sid,'students');
              const sSnap = await getDocs(studentsCol);
              const all = [];
              await Promise.all(sSnap.docs.map(async sd=>{
                try{
                  const evCol = collection(doc(fs,'orgs',oid,'schools',sid,'students',sd.id),'events');
                  const eSnap = await getDocs(query(evCol, where('sessionId','==', s.id)));
                  eSnap.docs.forEach(d=>all.push({ ...d.data() }));
                }catch{}
              }));
              evSnap = { docs: all.map(x=>({ data:()=>x })) };
            }
          }
          if(!evSnap) return;
          const seen = new Map(); // studentId -> { calledAt, enRouteAt, name, classId }
          evSnap.docs.forEach(d=>{
            const ev = d.data()||{}; const sid2 = ev.studentId || null; if(!sid2) return;
            const rec = seen.get(sid2) || { calledAt:null, enRouteAt:null, name: ev.studentName||'', classId: ev.classId||'' };
            if(ev.status==='called' && !rec.calledAt) rec.calledAt = ev.at;
            if((ev.status==='en_route'||ev.status==='enroute') && !rec.enRouteAt) rec.enRouteAt = ev.at;
            seen.set(sid2, rec);
          });
          seen.forEach((rec, sid3)=>{
            const cMs = ms(rec.calledAt); const eMs = ms(rec.enRouteAt);
            if(cMs && eMs && eMs>=cMs){
              const delta = eMs - cMs;
              // class agg
              const cc = byClass.get(rec.classId)||{ sum:0, n:0 }; cc.sum += delta; cc.n += 1; byClass.set(rec.classId, cc);
              // student agg
              const ss = byStudent.get(sid3)||{ name: rec.name||sid3, classId: rec.classId||'', sum:0, n:0 }; ss.sum += delta; ss.n += 1; byStudent.set(sid3, ss);
            }
          });
        }catch(err){ console.warn('[lb] batch session failed', err); }
      }));
    }
    while(i<sessions.length){ await nextBatch(); }

    // Rank classes (min avg first)
    const classRows = Array.from(byClass.entries()).map(([classId, v])=>({ classId, className: classMap[classId]||classId||'—', avgSec: (v.n? (v.sum/v.n)/1000 : null), n:v.n }))
      .filter(r=> r.n>0 && r.avgSec!=null).sort((a,b)=> a.avgSec - b.avgSec).slice(0, 10);
    // Rank students
    const studentRows = Array.from(byStudent.entries()).map(([sid, v])=>({ id:sid, name: v.name||sid, classId: v.classId||'', className: classMap[v.classId]||v.classId||'', avgSec: (v.n? (v.sum/v.n)/1000 : null), n:v.n }))
      .filter(r=> r.n>0 && r.avgSec!=null).sort((a,b)=> a.avgSec - b.avgSec).slice(0, 20);

    // Render
    function renderList(host, rows, subfmt){
      if(!rows.length){ host.innerHTML = '<li class="lb-empty">No records in range.</li>'; return; }
      const fastest = rows[0]?.avgSec || 1;
      host.innerHTML = rows.map((r,i)=>{
        const pct = Math.max(0.1, Math.min(1, fastest>0? (fastest / r.avgSec) : 1));
        const medalClass = i===0? 'rank-1' : i===1? 'rank-2' : i===2? 'rank-3' : '';
        return `
          <li class="lb-row">
            <div class="lb-rank ${medalClass}">${i+1}</div>
            <div>
              <div class="lb-name">${r.className? (r.name? r.name : r.className) : (r.name||'—')}</div>
              <div class="lb-sub">${subfmt(r)}</div>
              <div class="lb-bar" aria-hidden="true"><span style="width:${(pct*100).toFixed(0)}%"></span></div>
            </div>
            <div class="lb-time">${fmtSec(r.avgSec)}</div>
          </li>`;
      }).join('');
    }

    renderList(classList, classRows, r=>`${r.className} • ${r.n} samples`);
    renderList(studentList, studentRows, r=>`${r.className||'—'} • ${r.n} samples`);

    lbMeta.textContent = `${label} • ${sessions.length} sessions`;
    classMeta.textContent = classRows.length ? `Top ${classRows.length}` : '—';
    studentMeta.textContent = studentRows.length ? `Top ${studentRows.length}` : '—';

    // Celebrate if we have winners
    if (classRows.length || studentRows.length) { try { confettiBurst(); } catch {} }
  }

  rangeSel.addEventListener('change', buildLeaderboard);
  buildLeaderboard();
  </script>
</body>
</html>
