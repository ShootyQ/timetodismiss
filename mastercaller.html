<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time To Dismiss — Master Caller (Tiles)</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="/styles.css?v=2025-09-05-MC4" />
  <link rel="preconnect" href="https://www.gstatic.com" />
  <script>(function(){ try{ console.log('[TTD] Page BUILD','2025-10-12-MC5','tiles'); }catch{} })();</script>
  <script src="/site-header.js?v=2025-10-13-HDR5" defer></script>
  <style>
    /* Scoped styles for the tiles page */
    .tiles-main{ padding:8px 0 20px; }
    .tiles-container{ padding:8px 3%; }

  /* Toolbar */
  .row-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 4%; }
    .row-top h1{ font-size:1.05rem; margin:0; font-weight:800; }
    .filters{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .filters select, .filters input{ border:1px solid #e5e7eb; border-radius:10px; padding:8px 10px; background:#fff; color:#0b132b; }
  /* iOS: prevent zoom on focus */
  .filters input, .filters select{ font-size:16px; }

    .tiles-toolbar{ display:flex; gap:8px; align-items:center; padding:6px 3%; }
    .tiles-toolbar select{ border:1px solid #e5e7eb; border-radius:10px; padding:.45rem .6rem; }
    .tiles-toolbar .spacer{ flex:1 1 auto; }

    /* Grid: configurable via CSS variables with sensible defaults */
  .tiles-grid{ display:grid; grid-template-columns: repeat(var(--tiles-cols, 6), minmax(0, 1fr)); grid-auto-rows: var(--tile-row-h, 54px); gap:6px; align-content:start; list-style:none; padding:0; margin:0; }
    .tiles-grid > li{ min-width:0; }

    /* Responsive override if user hasn't set cols; once user sets cols, we keep their value */
    @media (max-width: 380px){ :root:not([data-tiles-user]) .tiles-grid{ grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    @media (min-width: 900px){ :root:not([data-tiles-user]) .tiles-grid{ grid-template-columns: repeat(8, 1fr); } }

    /* Tile styles */
  .tile-btn{ position:relative; display:flex; flex-direction:column; justify-content:flex-start; align-items:flex-start; gap:4px; border:1px solid #e5e7eb; border-radius:10px; padding:6px 8px 6px; background:#fff; color:var(--text); min-width:0; width:100%; height:100%; }
    .tile-btn:active{ transform: translateY(1px); }
  .tile-name{ font-weight:800; font-size: var(--tile-font); width:100%; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3; overflow:hidden; line-height:1.05; }
  .tile-tag{ font-size: var(--tile-sub); color:var(--muted); display:flex; gap:6px; width:100%; overflow:hidden; align-items:center; }
  .tile-tag .pill{ background:#f1f5f9; color:var(--text); border:1px solid #e5e7eb; border-radius:8px; padding:.1rem .35rem; font-weight:700; font-size: calc(var(--tile-sub) * 0.9); white-space:nowrap; }
    .tile-tag .muted{ color:#64748b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* Status styles (match master page) */
    .tile-btn.called{ background: var(--called); color: var(--calledText); border-color: rgba(0,0,0,.12); }
    .tile-btn.called .tile-name{ color: var(--calledText); }
    .tile-btn.called .tile-tag .pill{ background: rgba(0,0,0,.12); color: var(--calledText); border-color: transparent; }
    .tile-btn.called .tile-tag .muted{ color: var(--calledText); opacity:.95; }

    .tile-btn.en_route{ background:#ffedd5; color:#7c2d12; border-color:#fdba74; }
    .tile-btn.en_route .tile-tag .pill{ background:#fed7aa; color:#9a3412; border-color:transparent; }
    .tile-btn.en_route .tile-tag .muted{ color:#9a3412; opacity:.95 }

    .tile-btn.picked_up{ background: color-mix(in srgb, var(--called) 22%, #ffffff); color: var(--calledText); border-color: rgba(0,0,0,.12); }
    .tile-btn.picked_up .tile-tag .pill{ background: rgba(0,0,0,.12); color: var(--calledText); border-color: transparent; }
    .tile-btn.picked_up .tile-tag .muted{ color: var(--calledText); opacity:.9 }

  /* Absent: muted violet tone, matches classroom styling */
  .tile-btn.absent{ background:#f3e8ff; /* violet-100 */ color:#3b0764; border-color:#e9d5ff; }
  .tile-btn.absent .tile-name{ color:#3b0764; }
  .tile-btn.absent .tile-tag .pill{ background:#e9d5ff; color:#6b21a8; border-color:transparent; }
  .tile-btn.absent .tile-tag .muted{ color:#6b21a8; opacity:.95 }

    /* Letter tile (group header) */
    .letter-tile{ display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.05rem; border:1px solid var(--accent); color:var(--accent); background:#f8fafc; border-radius:10px; pointer-events:none; }

    /* Action sheet */
    .sheet-scrim{ position:fixed; inset:0; background:rgba(2,6,23,.45); opacity:0; pointer-events:none; transition: opacity .18s ease; }
    .sheet{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -12px 28px rgba(2,6,23,.16); transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1); will-change: transform; padding:12px; }
    .sheet.open{ transform: translateY(0); }
    .sheet-scrim.open{ opacity:1; pointer-events:auto; }
    .sheet .sheet-title{ font-weight:800; margin:2px 2px 8px; }
    .sheet .actions{ display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:8px; }
    .sheet .btn{ padding:.6rem .7rem; border-radius:10px; font-weight:800; }

    .btn-muted{ background:#f8fafc; color:#0b132b; border:1px solid #e5e7eb; }

    /* Toast */
    .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:16px; background:#0b132b; color:#fff; padding:.5rem .75rem; border-radius:8px; font-weight:700; display:none; }
    .toast.show{ display:block; }

    /* --- Readability upgrades --- */
    :root{ --tile-scale: 1; }

    /* Derive type sizes from row height; clamp to sane bounds and apply user scale */
    .tiles-grid{
  --tile-font: clamp(18px, calc(var(--tile-row-h, 54px) * 0.58), 60px);
  --tile-sub : clamp(13px, calc(var(--tile-row-h, 54px) * 0.28), 30px);
      --tile-gap : clamp(4px,  calc(var(--tile-row-h, 54px) * 0.10), 10px);
      --tile-font: calc(var(--tile-font) * var(--tile-scale));
      --tile-sub : calc(var(--tile-sub)  * var(--tile-scale));
    }

    /* Scale text inside tiles by default */
    .tiles-grid > li{
      font-size: var(--tile-font);
      line-height: 1.15;
      /* Fallback first */
      overflow-wrap: anywhere;
    }
    .tiles-grid > li .t-sub,
    .tiles-grid > li .sub{
      font-size: var(--tile-sub);
      line-height: 1.1;
    }
    .tiles-grid > li .t-name{
      font-weight: 800;
      letter-spacing: .2px;
      line-height: 1.05;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tiles-grid > li .btn{
      font-size: calc(var(--tile-sub) * 0.95);
      padding: .4rem .55rem;
    }

    /* Scanner highlight */
    .tile-btn.scan-hit{ outline:3px solid #2563eb; box-shadow:0 0 0 4px rgba(37,99,235,.35); position:relative; }
    @keyframes scanFlash{ 0%{ background:#dbeafe; } 50%{ background:#fff; } 100%{ background:inherit; } }
    .tile-btn.scan-hit{ animation: scanFlash 1.3s ease; }

    /* iOS Safari: prevent page zoom on focus by ensuring >=16px */
  .tiles-toolbar input,
  .tiles-toolbar select,
  .tiles-toolbar textarea{ font-size:16px; line-height:1.2; }

    /* Options group: inline on desktop; collapsed on mobile until toggled */
    .tiles-toolbar .opts{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    @media (max-width: 640px){
      .tiles-toolbar .opts{ display:none; }
      .tiles-toolbar.opts-open .opts{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:8px; width:100%; }
    }

    /* Mobile: keep Hub + End visible by wrapping toolbar rows */
    @media (max-width: 640px){
      .tiles-toolbar{ flex-wrap: wrap; row-gap: 8px; }
      .tiles-toolbar .spacer{ flex-basis: 100%; height: 0; }
      .tiles-toolbar .small{ width: 100%; display:flex; justify-content:flex-end; }
      #endSessionBtn{ padding:.5rem .65rem; }
    }

    /* Mobile declutter: reduce top UI on small screens */
    @media (max-width: 640px){
      .row-top h1{ display:none; }
      .small-help{ display:none; }
      #classFilter{ display:none; }
      #tilesCount{ display:none; }
      .row-top{ padding:6px 3%; }
      .filters{ flex:1 1 auto; width:100%; }
      #tilesSearch{ flex:1 1 auto; width:100%; }
    }
  </style>
  <script>
    // Make touchmove passive for smoother scrolling
    (function(){ try { const _add = EventTarget.prototype.addEventListener; EventTarget.prototype.addEventListener = function(t, cb, o){ if(t==='touchmove' && (!o||o===true)) return _add.call(this,t,cb,{passive:true}); return _add.call(this,t,cb,o); } } catch(e){} })();
  </script>
</head>
<body class="sd-body">
  <main class="container tiles-main">
    <div class="row-top">
  <h1>Master Caller</h1>
      <div class="filters">
        <label class="sr-only" for="classFilter">Filter by class</label>
        <select id="classFilter" aria-label="Filter by class"></select>
        <input id="tilesSearch" placeholder="Search name, tag, or family" inputmode="search" autocomplete="off" enterkeyhint="search" />
      </div>
    </div>

  <div class="small-help">Tap a student to call or open actions. RS calls a ride share/family group.</div>

    <div class="tiles-toolbar">
      <button id="openScanner" class="btn btn-outline" type="button" style="font-size:.7rem;">Camera</button>
      <button id="optsBtn" class="btn btn-outline" type="button" style="font-size:.7rem;">Options</button>
      <div class="opts" id="tilesOpts">
        <label class="small">Cols
          <select id="colsSel" aria-label="Columns">
            <option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option>
          </select>
        </label>
        <label class="small">Rows
          <select id="rowsSel" aria-label="Rows">
            <option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option>
          </select>
        </label>
        <label class="small">Sort
          <select id="sortSel" aria-label="Sort by">
            <option value="first" selected>First Name</option>
            <option value="last">Last Name</option>
            <option value="callAvg">Typical (Avg vs start)</option>
          </select>
        </label>
        <label class="small" style="display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="scanEnable" /> Scan
        </label>
        <label class="small" id="scanAutoWrap" style="display:none; align-items:center; gap:4px;">
          <input type="checkbox" id="scanAutoCall" /> Auto Call
        </label>
      </div>
      <div class="spacer"></div>
      <div class="small" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
        <a id="toHub" class="btn btn-outline" href="/callerhub.html" style="font-size:.7rem;">Hub</a>
        <button id="endSessionBtn" class="btn btn-danger" type="button" style="font-size:.7rem;">End Dismissal</button>
      </div>
      <span id="tilesCount" class="small muted">—</span>
    </div>
        <div id="tilesSessionBar" class="small muted" style="margin:4px 3% 10px; display:none;">
          <span id="tilesSessionMode">Session</span> • <span id="tilesSessionElapsed">00:00</span><span id="tilesSessionAutoEnd"></span>
        </div>

  <div class="small muted" id="scanHelp" style="margin:0 3% 6px; display:none;">Bluetooth scanner: scan car tag or student ID (Enter ends scan). Camera: use the Camera button. Prefix RS:TAG for ride share.</div>

    <div class="tiles-container">
      <ul id="tiles" class="tiles-grid" aria-live="polite"></ul>
    </div>
  </main>

  <!-- Action sheet -->
  <div id="sheetScrim" class="sheet-scrim" aria-hidden="true"></div>
  <section id="actionSheet" class="sheet" aria-label="Actions" aria-hidden="true">
    <div class="sheet-title" id="sheetTitle">Actions</div>
    <div class="actions" id="sheetActions"></div>
  </section>
  <!-- Camera scanner overlay host -->
  <div id="qrSheet" hidden></div>

  <script type="module">
  import { init, getClasses, onStudents, onCarGroups, setStudentStatus, getGroupByTag, setStatusForGroup, setStatusForTag, setStatusForRideShare, setActiveSession, getStudentStatsForDay } from '/app.js?v=23';
    await init();

    const classFilter = document.getElementById('classFilter');
    const search = document.getElementById('tilesSearch');
    const tiles = document.getElementById('tiles');
    const sheet = document.getElementById('actionSheet');
    const scrim = document.getElementById('sheetScrim');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetActions = document.getElementById('sheetActions');
    const toast = document.getElementById('toast');
  const colsSel = document.getElementById('colsSel');
  const rowsSel = document.getElementById('rowsSel');
  const sortSel = document.getElementById('sortSel');
  const scanEnable = document.getElementById('scanEnable');
  const scanAutoCall = document.getElementById('scanAutoCall');
  const scanAutoWrap = document.getElementById('scanAutoWrap');
  const scanHelp = document.getElementById('scanHelp');
  const tilesCount = document.getElementById('tilesCount');
  const toHub = document.getElementById('toHub');
  const endSessionBtn = document.getElementById('endSessionBtn');
  const optsBtn = document.getElementById('optsBtn');
  const tilesToolbar = document.querySelector('.tiles-toolbar');
  const tilesSessionBar = document.getElementById('tilesSessionBar');
  const tilesSessionMode = document.getElementById('tilesSessionMode');
  const tilesSessionElapsed = document.getElementById('tilesSessionElapsed');
  const tilesSessionAutoEnd = document.getElementById('tilesSessionAutoEnd');
  let tilesStartedAt = null; let tilesEnded=false; let autoEndMinutes=30; let tilesTimer=null; let tilesEnding=false;
  let current = null;

  // Highlight helper for scanned/updated students
  function highlightStudentTile(studentId){
    try{
      const el = tiles?.querySelector(`.tile-btn[data-id="${studentId}"]`);
      if(el){ el.classList.add('scan-hit'); setTimeout(()=>{ try{ el.classList.remove('scan-hit'); }catch{} }, 1300); }
    }catch{}
  }

    function showToast(msg){ if(!toast) return; toast.textContent = msg||''; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 1500); }
    function openSheet(){ sheet?.classList.add('open'); scrim?.classList.add('open'); sheet?.setAttribute('aria-hidden','false'); scrim?.setAttribute('aria-hidden','false'); }
    function closeSheet(){ sheet?.classList.remove('open'); scrim?.classList.remove('open'); sheet?.setAttribute('aria-hidden','true'); scrim?.setAttribute('aria-hidden','true'); }
    scrim?.addEventListener('click', closeSheet);

    function escapeHtml(s){ return (''+(s??''))
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\"/g,'&quot;').replace(/'/g,'&#39;'); }

    // Families map TAG -> group
  let tagToGroup = {};
  let rideShareToGroup = {};
  let carTagIndex = new Map(); // NORMALIZED_TAG -> array of students
  let studentIdIndex = new Map(); // NORMALIZED_ID -> student
  let origTagByNormalized = new Map(); // NORMALIZED_TAG -> FIRST ORIGINAL (with punctuation) TAG
    onCarGroups((groups) => {
      const m = {};
      const rsMap = {};
      (groups||[]).forEach(g => {
        (g.tags||[]).forEach(t => m[String(t||'').toUpperCase()] = g);
        const rs = (g.rideShare||g.rideshare||'').trim(); if (rs) rsMap[rs.toUpperCase()] = g;
      });
      tagToGroup = m; rideShareToGroup = rsMap;
    });

    // Grid size persistence
    const LS_COLS = 'TILES_COLS';
    const LS_ROWS = 'TILES_ROWS';
    function applyGridSize(){
      const cols = Math.max(3, Math.min(7, parseInt(colsSel.value, 10) || 6));
      const rows = Math.max(3, Math.min(7, parseInt(rowsSel.value, 10) || 5));
      document.documentElement.style.setProperty('--tiles-cols', String(cols));
      document.documentElement.setAttribute('data-tiles-user','1');
      const toolbarH = (document.querySelector('.tiles-toolbar')?.offsetHeight || 48) + 24;
      const avail = Math.max(200, window.innerHeight - toolbarH);
      const gap = 6;
      const rowH = Math.max(44, Math.floor((avail - (rows-1)*gap) / rows));
      tiles.style.setProperty('--tile-row-h', rowH + 'px');
      localStorage.setItem(LS_COLS, String(cols));
      localStorage.setItem(LS_ROWS, String(rows));
    }
    function loadGridPrefs(){
      const c = parseInt(localStorage.getItem(LS_COLS)||'', 10); if (c>=3 && c<=7) colsSel.value = String(c);
      const r = parseInt(localStorage.getItem(LS_ROWS)||'', 10); if (r>=3 && r<=7) rowsSel.value = String(r);
      applyGridSize();
    }
    colsSel.addEventListener('change', applyGridSize);
    rowsSel.addEventListener('change', applyGridSize);
    window.addEventListener('resize', applyGridSize);
    loadGridPrefs();

  // Session linking
  const urlParams = new URLSearchParams(location.search);
  const sessionId = urlParams.get('session');
  if (sessionId){
    try { setActiveSession(sessionId); } catch {}
    if (toHub) toHub.href = '/callerhub.html?session=' + encodeURIComponent(sessionId);
    if (tilesSessionBar) tilesSessionBar.style.display='block';
    (async ()=>{
      await waitForContext();
      try{
        const { doc, onSnapshot, getFirestore, getDoc } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js');
        const oid=globalThis.SD?.orgId; const sid=globalThis.SD?.schoolId; if(!oid||!sid) return;
        const fs = getFirestore();
        const sRef = doc(fs,'orgs',oid,'schools',sid,'callSessions',sessionId);
        const setRef = doc(fs,'orgs',oid,'schools',sid,'settings','dismissal');
        try { const setSnap = await getDoc(setRef); if(setSnap.exists()){ const cfg=setSnap.data(); if(cfg.autoEndMinutes>=5&&cfg.autoEndMinutes<=240) autoEndMinutes=cfg.autoEndMinutes; } } catch {}
        onSnapshot(sRef,(snap)=>{
          if(!snap.exists()) return;
          const data = snap.data();
          if(data.startedAt && !tilesStartedAt){ tilesStartedAt = data.startedAt.toDate(); startTilesTimer(); }
          if(data.mode) tilesSessionMode.textContent = 'Session ('+(data.mode||'tiles')+')';
          if(data.endedAt && !tilesEnded){ tilesEnded=true; endSessionBtn.textContent='Dismissal Ended'; endSessionBtn.disabled=true; if(tilesSessionElapsed && tilesStartedAt){ tilesSessionElapsed.textContent = tilesFmt(data.endedAt.toDate()-tilesStartedAt); } }
        }, (err)=> console.warn('[tiles] session snapshot error', err));
      }catch(e){ console.warn('[tiles] session watcher init failed', e); }
    })();
  }

  async function endSession(opts){
    const skipConfirm = !!(opts && opts.skipConfirm);
    if (!sessionId){ endSessionBtn.disabled = true; endSessionBtn.textContent='No Session'; return; }
    if(tilesEnded || tilesEnding) return;
    if(!skipConfirm){ if(!confirm('End dismissal now? This will finalize the session and stop timing.')) return; }
    tilesEnding = true;
    endSessionBtn.disabled = true; endSessionBtn.textContent='Ending…';
    try {
      const { updateDoc, doc, serverTimestamp, setDoc, increment, getFirestore } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js');
      const fs = getFirestore();
      const oid = globalThis.SD?.orgId; const sid = globalThis.SD?.schoolId; if (!oid || !sid) throw new Error('Missing org/school context');
      const sessRef = doc(fs,'orgs',oid,'schools',sid,'callSessions',sessionId);
      await updateDoc(sessRef, { endedAt: serverTimestamp() });
      try {
        const signalRef = doc(fs,'orgs',oid,'schools',sid,'signals','dismissal');
        await setDoc(signalRef,{ message:'Dismissal is over!', lastAt: serverTimestamp(), seq: increment(1) }, { merge:true });
      } catch(sigErr){ console.warn('[tiles] dismissal signal failed', sigErr); }
      tilesEnded=true;
      try { if(tilesTimer){ clearInterval(tilesTimer); tilesTimer=null; } } catch {}
      if(tilesStartedAt && tilesSessionElapsed){ const ms = Date.now() - tilesStartedAt.getTime(); tilesSessionElapsed.textContent = tilesFmt(ms); }
      endSessionBtn.textContent='Dismissal Ended';
    } catch(e){ console.warn('[tiles] end session failed', e); if(!skipConfirm) alert('Could not end dismissal here. Try Analytics → End Now.'); endSessionBtn.textContent='End Dismissal'; endSessionBtn.disabled=false; }
    finally { tilesEnding = false; }
  }
  endSessionBtn?.addEventListener('click', endSession);

  // Options toggle (mobile)
  optsBtn?.addEventListener('click', () => { tilesToolbar?.classList.toggle('opts-open'); });

  function tilesFmt(ms){ if(ms<0) ms=0; const s=Math.floor(ms/1000); const m=Math.floor(s/60); const rs=s%60; const h=Math.floor(m/60); const rm=m%60; return (h>0? (h+':'+String(rm).padStart(2,'0')):rm)+':'+String(rs).padStart(2,'0'); }
  async function waitForContext(maxMs=15000){ const start=Date.now(); while(Date.now()-start<maxMs){ if(globalThis.SD?.orgId && globalThis.SD?.schoolId) return true; await new Promise(r=>setTimeout(r,120)); } return false; }
  function startTilesTimer(){ if(!tilesStartedAt) return; function tick(){ const now=new Date(); const elapsed= now - tilesStartedAt; if(tilesSessionElapsed) tilesSessionElapsed.textContent=tilesFmt(elapsed); const limit = autoEndMinutes*60000; if(!tilesEnded){ const remain = limit - elapsed; if(remain<=0){ autoEndTiles(); } else if(tilesSessionAutoEnd){ tilesSessionAutoEnd.textContent=' • Auto end in '+tilesFmt(remain)+' (limit '+autoEndMinutes+'m)'; } } } tick(); tilesTimer=setInterval(tick,1000); }
  async function autoEndTiles(){ if(tilesEnded || tilesEnding) return; try{ await endSession({ skipConfirm:true }); }catch{} }

  // Removed sound feedback for callers (silent operations)
  function ding(){ /* no-op */ }

    // Call by identifier: prefers car tag, but recognizes ride share tokens too
    async function callRideShareByTag(tag){
      const TAG = String(tag||'').toUpperCase();
      const grp = tagToGroup[TAG];
      const rsGrp = rideShareToGroup[TAG];
      ding();
      // 1) If this matches a normal car tag, call that family/group first
      if (grp && setStatusForGroup) return setStatusForGroup(grp.id, 'called');
      if (grp && Array.isArray(grp.tags) && grp.tags.length) {
        const tags = grp.tags.map(t => String(t||'').toUpperCase());
        return Promise.allSettled(tags.map(t => setStatusForTag(t, 'called')));
      }
      // 2) If it looks like a ride share token, apply ride-share wide
      if (rsGrp && setStatusForRideShare) return setStatusForRideShare(TAG, 'called');
      // 3) Fallback: treat as plain tag
      if (grp?.rideShare && setStatusForRideShare) return setStatusForRideShare(grp.rideShare, 'called');
      return setStatusForTag(TAG, 'called');
    }

    let allStudents = [];

    function render(list){
      const rows = [];
      let prevLetter = '';
      const items = (list||[]);
      const sortBy = sortSel?.value || 'first';
      tilesCount.textContent = `${items.length} students`;
      for (const s of items){
        const tag = s.carTag ? String(s.carTag).trim().toUpperCase() : '';
        const grp = tag ? tagToGroup[tag] : null;
        const fam = grp?.name || s.groupName || s.carName || '';
        const statusCls = s.status ? String(s.status) : '';
        
        // Determine the letter grouping based on sort method (suppress groups for callAvg)
        if (sortBy !== 'callAvg'){
          let sortName, initial;
          if (sortBy === 'last') {
            // Use last name for letter grouping
            sortName = (s.lastName || '').trim() || (s.name || '').trim().split(/\s+/).pop() || '';
          } else {
            // Use first name for letter grouping
            sortName = (s.firstName || '').trim() || (s.name || '').trim().split(/\s+/)[0] || '';
          }
          initial = sortName.charAt(0).toUpperCase();
          const letter = (initial >= 'A' && initial <= 'Z') ? initial : '#';
          const isHead = letter !== prevLetter;
          if (isHead) {
            rows.push(`<li role="presentation"><div class="letter-tile" aria-hidden="true">${letter}</div></li>`);
            prevLetter = letter;
          }
        }
        const hasRS = !!grp?.rideShare || (grp && (grp.tags||[]).length>0);
        rows.push(`<li role="listitem">
          <div class="tile-btn ${statusCls}" data-id="${s.id}">
            <div class="tile-name">${escapeHtml(s.name||'')}</div>
            <div class="tile-tag">
              ${tag ? `<span class=\"pill\">${escapeHtml(tag)}</span>` : ''}
              ${hasRS && tag ? `<button type=\"button\" class=\"pill\" data-rs-tag=\"${escapeHtml(tag)}\">RS</button>` : ''}
              <span class="muted">${escapeHtml(fam)}</span>
            </div>
          </div>
        </li>`);
      }
      tiles.innerHTML = rows.join('');
    }

    // --- Typical-start sorting support (avg offset from session start) ---
    // Map of studentId -> average milliseconds after dismissal start when 'called'
    const studentAvgOffset = new Map();
    let avgOffsetsLoading = false;
    let avgOffsetsPromise = null;

    async function ensureAvgOffsets(options){
      // Build once per page load; refresh if explicitly requested
      if (avgOffsetsPromise && !options?.force) return avgOffsetsPromise;
      avgOffsetsPromise = (async () => {
        avgOffsetsLoading = true;
        try {
          // Wait for tenant
          await waitForContext();
          const oid = globalThis.SD?.orgId; const sid = globalThis.SD?.schoolId; if(!oid||!sid) return;
          // Fetch recent sessions to get startedAt per day
          const mod = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js');
          const { getFirestore, collection, query: qy, orderBy: ob, limit: lim, getDocs: gds } = mod;
          const fs = getFirestore();
          const coll = collection(fs,'orgs',oid,'schools',sid,'callSessions');
          const snap = await gds(qy(coll, ob('startedAt','desc'), lim(10)));
          const sessions = [];
          snap.forEach(d => { const data = d.data()||{}; const startedAt = data.startedAt?.toDate?.(); if(startedAt) sessions.push({ id:d.id, startedAt }); });
          if (!sessions.length) return;
          // Unique days (UTC) to reduce duplicate fetches
          const dayToStart = new Map();
          for (const s of sessions){ const day = s.startedAt.toISOString().slice(0,10); if(!dayToStart.has(day)) dayToStart.set(day, s.startedAt); }
          // Build a set of students in view to constrain work
          const targetIds = new Set((allStudents||[]).map(s=>s.id));
          // Accumulators
          const sums = new Map(); // id -> total ms
          const counts = new Map(); // id -> n
          // For each day, fetch stats and accumulate deltas
          for (const [day, startAt] of dayToStart.entries()){
            try{
              const stats = await getStudentStatsForDay(day).catch(()=>[]);
              for (const st of (stats||[])){
                const sid2 = st.id?.split(':')[1] || st.studentId || null;
                if (!sid2 || !targetIds.has(sid2)) continue;
                const calledAt = st.calledAt?.toDate?.();
                if (!calledAt || !startAt) continue;
                const delta = Math.max(0, calledAt - startAt);
                if (!isFinite(delta)) continue;
                sums.set(sid2, (sums.get(sid2)||0) + delta);
                counts.set(sid2, (counts.get(sid2)||0) + 1);
              }
            }catch(e){ /* ignore per-day failures */ }
          }
          // Finalize averages
          studentAvgOffset.clear();
          for (const [id, total] of sums.entries()){
            const c = counts.get(id)||0; if (c>0) studentAvgOffset.set(id, Math.round(total/c));
          }
        } catch (e){ console.warn('[tiles] avg offsets build failed', e); }
        finally { avgOffsetsLoading = false; }
      })();
      return avgOffsetsPromise;
    }

    function applyFilters(){
      const q = (search?.value || '').trim().toLowerCase();
      const sortBy = sortSel?.value || 'first';
      const base = !q ? allStudents : allStudents.filter(s => {
        const tag = (s.carTag || '').toString().toLowerCase();
        const fam = (s.groupName || s.carName || '').toString().toLowerCase();
        return (s.name||'').toLowerCase().includes(q) || tag.includes(q) || fam.includes(q);
      });
  // Status ordering: Absent should always be at the bottom
  const order = { waiting: 0, null: 0, undefined: 0, called: 1, en_route: 2, picked_up: 3, absent: 4 };
      const list = base.slice().sort((a,b) => {
        const as = order[a.status] ?? 0;
        const bs = order[b.status] ?? 0;
        if (as !== bs) return as - bs;
        if (sortBy === 'callAvg'){
          const ai = studentAvgOffset.has(a.id) ? studentAvgOffset.get(a.id) : Number.POSITIVE_INFINITY;
          const bi = studentAvgOffset.has(b.id) ? studentAvgOffset.get(b.id) : Number.POSITIVE_INFINITY;
          if (ai !== bi) return ai - bi;
          // tie-breaker by name
          const an = (a.name||'').toLowerCase();
          const bn = (b.name||'').toLowerCase();
          return an.localeCompare(bn);
        }
        
        // Sort by first name or last name based on selection
        let aSortKey, bSortKey;
        if (sortBy === 'last') {
          // Extract last name (last word) or use full name as fallback
          const aLastName = (a.lastName || '').trim() || (a.name || '').trim().split(/\s+/).pop() || '';
          const bLastName = (b.lastName || '').trim() || (b.name || '').trim().split(/\s+/).pop() || '';
          aSortKey = aLastName.toLowerCase();
          bSortKey = bLastName.toLowerCase();
        } else {
          // Extract first name (first word) or use full name as fallback
          const aFirstName = (a.firstName || '').trim() || (a.name || '').trim().split(/\s+/)[0] || '';
          const bFirstName = (b.firstName || '').trim() || (b.name || '').trim().split(/\s+/)[0] || '';
          aSortKey = aFirstName.toLowerCase();
          bSortKey = bFirstName.toLowerCase();
        }
        
        return aSortKey.localeCompare(bSortKey);
      });
      render(list);
    }

    let unsub = null;
    let unsubGroups = null;
    const groupMap = {}; // live map for actions panel

    function resubscribe(){
      if (unsub) { try{unsub();}catch{} unsub=null; }
      if (unsubGroups) { try{unsubGroups();}catch{} unsubGroups=null; }
      unsubGroups = onCarGroups((groups) => {
        const map = {};
        const rsMap = {};
        (groups||[]).forEach(g => {
          (g.tags||[]).forEach(t => map[String(t||'').toUpperCase()] = g);
          const rs = (g.rideShare||g.rideshare||'').trim(); if (rs) rsMap[rs.toUpperCase()] = g;
        });
        Object.keys(groupMap).forEach(k => delete groupMap[k]);
        Object.assign(groupMap, map);
        tagToGroup = map; rideShareToGroup = rsMap; // keep render map updated
      });
      const classId = classFilter?.value || null;
      unsub = onStudents(classId, (list) => {
        allStudents = Array.isArray(list) ? list : [];
        rebuildScanIndexes();
        // If sorting by callAvg, (re)build averages once students are loaded
        if ((sortSel?.value || '') === 'callAvg') { ensureAvgOffsets().then(()=>applyFilters()).catch(()=>applyFilters()); return; }
        applyFilters();
      });
    }
    function normScanKey(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').trim(); }
    function rebuildScanIndexes(){
      carTagIndex.clear(); studentIdIndex.clear(); origTagByNormalized.clear();
      for(const s of allStudents){
        const tag = normScanKey(s.carTag||'');
        if(tag){ if(!carTagIndex.has(tag)) carTagIndex.set(tag, []); carTagIndex.get(tag).push(s); }
        if(tag && !origTagByNormalized.has(tag)){
          const raw = (s.carTag||'').toString().trim().toUpperCase();
          origTagByNormalized.set(tag, raw);
        }
        const sid = normScanKey(s.studentId||s.id||'');
        if(sid && !studentIdIndex.has(sid)) studentIdIndex.set(sid, s);
      }
    }

    // Camera scanner event wiring (from /scanner.js)
    document.addEventListener('scan:car-tag', async (e) => {
      const tag = (e && e.detail && e.detail.tag) ? String(e.detail.tag).toUpperCase().trim() : '';
      if (!tag) return;
      try{
        await setStatusForTag(tag, 'called');
        const norm = normScanKey(tag);
        (carTagIndex.get(norm)||[]).forEach(st => highlightStudentTile(st.id));
        showToast('Family called');
      } catch(err){ console.warn('[tiles] camera tag scan failed', err); }
    });

    document.addEventListener('scan:student-id', async (e) => {
      const idRaw = (e && e.detail && e.detail.id) ? String(e.detail.id).trim() : '';
      if (!idRaw) return;
      const norm = normScanKey(idRaw);
      const stu = studentIdIndex.get(norm) || null;
      if (stu && stu.id){
        try { await setStudentStatus(stu.id, 'called'); highlightStudentTile(stu.id); showToast('Called'); } catch(err){ console.warn('[tiles] camera student scan failed', err); }
      } else {
        showToast('No match');
      }
    });

    async function populateClasses(){
      try{
        const classes = await getClasses();
        const opts = ['<option value="">All Classes</option>'].concat((classes||[]).map(c => `<option value="${c.id}">${escapeHtml(c.name||c.id)}</option>`));
        classFilter.innerHTML = opts.join('');
      }catch(e){ classFilter.innerHTML = '<option value="">All Classes</option>'; }
    }

    // Click handling on tiles — open action sheet; RS pill acts as quick action
    tiles.addEventListener('click', (e) => {
      const rs = e.target.closest('button[data-rs-tag]');
      if (rs) {
        const tag = rs.getAttribute('data-rs-tag');
  callRideShareByTag(tag).then(()=>showToast('Ride share called')).catch(err => console.error('[tiles] RS call failed', err));
        return;
      }
      const btn = e.target.closest('.tile-btn[data-id]');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      current = allStudents.find(s => s.id === id) || null;
      if (!current) return;
      sheetTitle.textContent = current.name || 'Actions';
      const tag = current.carTag ? String(current.carTag).trim().toUpperCase() : '';
      const hasTag = !!tag;
      const grp = tag ? (groupMap[tag] || null) : null;
      const hasRSorGroup = !!grp;
      const isCalled = current.status === 'called';
      const isEnRoute = current.status === 'en_route';
      const isPicked = current.status === 'picked_up';
      sheetActions.innerHTML = (isCalled || isEnRoute || isPicked)
        ? `
            <button id="aPicked" class="btn btn-primary">Picked Up</button>
            <button id="aClear" class="btn btn-danger">Clear</button>
          `
        : `
            <button id="aCall" class="btn btn-primary">Call</button>
            <button id="aFam" class="btn btn-secondary" ${!hasTag?'disabled':''}>Call Family</button>
            <button id="aRS" class="btn btn-secondary" ${!hasRSorGroup?'disabled':''}>Call Ride Share</button>
            <button id="aPicked" class="btn btn-muted">Picked Up</button>
          `;
      openSheet();
    });

    sheetActions?.addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b || !current) return;
      const id = current.id;
      try{
        if (b.id === 'aCall'){
          await setStudentStatus(id, 'called');
          showToast('Called');
        } else if (b.id === 'aFam'){
          const tag = current.carTag ? String(current.carTag).trim().toUpperCase() : '';
          if (tag){
            const g = await getGroupByTag(tag);
            if (g && g.id) await setStatusForGroup(g.id, 'called'); else await setStatusForTag(tag, 'called');
            showToast('Family called');
          }
        } else if (b.id === 'aRS'){
          const tag = current.carTag ? String(current.carTag).trim().toUpperCase() : '';
          const grp = tag ? (groupMap[tag] || await getGroupByTag(tag)) : null;
          if (grp && grp.id){ await setStatusForGroup(grp.id, 'called'); showToast('Ride share called'); }
          else if (grp && Array.isArray(grp.tags) && grp.tags.length){ await Promise.allSettled(grp.tags.map(t => setStatusForTag(String(t||'').toUpperCase(), 'called'))); showToast('Ride share called'); }
          else if (grp && grp.rideShare){ await setStatusForRideShare(grp.rideShare, 'called'); showToast('Ride share called'); }
          else if (tag){ await setStatusForTag(tag, 'called'); showToast('Family called'); }
        } else if (b.id === 'aPicked'){
          await setStudentStatus(id, 'picked_up');
          showToast('Picked up');
        } else if (b.id === 'aClear'){
          await setStudentStatus(id, 'waiting');
          showToast('Cleared');
        }
      } finally { closeSheet(); }
    });

    /* ---------------- Scanner Support (Bluetooth HID) ---------------- */
    const LS_SCAN_ENABLED = 'MC_SCAN_ENABLED';
    const LS_SCAN_AUTOCALL = 'MC_SCAN_AUTOCALL';
    function loadScanPrefs(){
      const en = localStorage.getItem(LS_SCAN_ENABLED) === '1';
      const ac = localStorage.getItem(LS_SCAN_AUTOCALL) === '1';
      if(scanEnable) scanEnable.checked = en;
      if(scanAutoCall) scanAutoCall.checked = ac;
      if(scanAutoWrap) scanAutoWrap.style.display = en ? 'flex' : 'none';
      if(scanHelp) scanHelp.style.display = en ? 'block':'none';
    }
    loadScanPrefs();
    scanEnable?.addEventListener('change', () => {
      localStorage.setItem(LS_SCAN_ENABLED, scanEnable.checked ? '1':'0');
      if(scanAutoWrap) scanAutoWrap.style.display = scanEnable.checked ? 'flex':'none';
      if(scanHelp) scanHelp.style.display = scanEnable.checked ? 'block':'none';
      if(!scanEnable.checked){ resetScanBuffer(); }
    });
    scanAutoCall?.addEventListener('change', () => {
      localStorage.setItem(LS_SCAN_AUTOCALL, scanAutoCall.checked ? '1':'0');
    });
    // Background scan detection: treat only very fast bursts ending with Enter as scans.
    let scanChars = []; // {ch,time}
    let scanLastTs=0;
    const SCAN_SEQ_TIMEOUT = 400; // gap that resets sequence
    const MAX_SCAN_DURATION = 800; // total ms between first & last char for a valid scan
    const MIN_SCAN_LEN = 3; // ignore tiny bursts
    const QUIET_FINALIZE_MS = 150; // if no new char within this window, attempt finalize (scanner usually ends burst)
    let quietTimer = null;
    let scanningSuspended = false; // true while user is typing in an input/textarea
    function resetScanBuffer(){ scanChars=[]; scanLastTs=0; }
    function bufferChar(ch){
      if (scanningSuspended) return;
      const now=Date.now();
      if(!scanChars.length || (now - scanLastTs) <= SCAN_SEQ_TIMEOUT){
        scanChars.push({ch,time:now});
        scanLastTs=now;
      } else { // too slow; start new sequence
        scanChars=[{ch,time:now}]; scanLastTs=now;
      }
      if(quietTimer){ clearTimeout(quietTimer); }
      quietTimer = setTimeout(()=>{ tryQuietFinalize(); }, QUIET_FINALIZE_MS);
    }
    function tryFinalizeScan(){
      if(!scanChars.length) return false;
      const first=scanChars[0].time; const last=scanChars[scanChars.length-1].time; const duration= last-first;
      if(scanChars.length < MIN_SCAN_LEN) { resetScanBuffer(); return false; }
      if(duration > MAX_SCAN_DURATION){ resetScanBuffer(); return false; }
      // Build raw string
      const raw = scanChars.map(o=>o.ch).join('').trim();
      resetScanBuffer();
      if(!raw) return false;
      handleScanCode(raw);
      return true;
    }
    function tryQuietFinalize(){
      // Only attempt if the last keystroke was recently and buffer not empty
      if(!scanChars.length) return;
      if (scanningSuspended) { resetScanBuffer(); return; }
      const now = Date.now();
      if(now - scanLastTs >= QUIET_FINALIZE_MS){
        tryFinalizeScan();
      }
    }
    function handleScanCode(code){
      const raw = String(code||'').trim();
      if(!raw) return;
      function parse(str){
        const s = str.trim();
        // Direct ride share prefix forms (RS:, RS-, RS=)
        if(/^RS[:=\-]/i.test(s)) return { rideShare: s.replace(/^RS[:=\-]/i,'').trim() };
        // key=value multi-part
        if(s.includes('=')){
          const parts = s.split(/[&;\n]/).map(p=>p.trim()).filter(Boolean);
          const kv = {};
          for(const p of parts){
            const i = p.indexOf('='); if(i<=0) continue;
            const k = decodeURIComponent(p.slice(0,i)).trim().toLowerCase();
            const v = decodeURIComponent(p.slice(i+1)).trim();
            if(k) kv[k]=v;
          }
          if(kv.rs || kv.rideshare || kv['rideShare']) return { rideShare: kv.rs||kv.rideshare||kv['rideShare'] };
          if(kv.student || kv.sid || kv.stud) return { studentId: kv.student||kv.sid||kv.stud };
          if(kv.car || kv.tag || kv.plate || kv.ticket) return { carTag: kv.car||kv.tag||kv.plate||kv.ticket };
        }
        // Bare token -> car tag
        return { carTag: s };
      }
      const parsed = parse(raw);
      const rideShare = parsed.rideShare ? String(parsed.rideShare).toUpperCase() : '';
      // Remove spaces; keep dashes (matching camera scanner normalization pattern)
      const carTagRaw = parsed.carTag ? String(parsed.carTag).toUpperCase().replace(/\s+/g,'') : '';
      const studentRaw = parsed.studentId ? String(parsed.studentId).trim() : '';
      console.log('[scan] HID parsed', { raw, rideShare, carTagRaw, studentRaw });

      // 1. Ride share direct
      if(rideShare){
        const RS = rideShare.toUpperCase();
        const grp = rideShareToGroup[RS];
        (setStatusForRideShare ? setStatusForRideShare(RS, 'called') : Promise.resolve())
          .then(() => {
            // Optional: highlight tiles for a known ride share group
            try {
              if (grp && Array.isArray(grp.tags)) {
                const toHi = grp.tags.map(t => normScanKey(String(t||'')));
                for (const k of toHi) { (carTagIndex.get(k)||[]).forEach(st => highlightStudentTile(st.id)); }
              }
            } catch {}
            showToast('Ride share called');
          })
          .catch(err=>{ console.warn('[scan] ride share call failed', err); showToast('RS not found'); });
        return;
      }

      // 2. Family/Car Tag attempt
      if(carTagRaw){
        const normalized = normScanKey(carTagRaw);
        setStatusForTag(carTagRaw, 'called')
          .then(updated => {
            console.log('[scan] family attempt via tag', { tag: carTagRaw, updated });
            if(updated>0){
              (carTagIndex.get(normalized)||[]).forEach(st => highlightStudentTile(st.id));
              showToast('Family called');
            } else if(studentRaw){
              handleAsStudent(studentRaw.toUpperCase(), normScanKey(studentRaw));
            } else {
              // treat as possible student ID
              handleAsStudent(carTagRaw, normalized);
            }
          })
          .catch(err => {
            console.warn('[scan] family call error', err);
            if(studentRaw){ handleAsStudent(studentRaw.toUpperCase(), normScanKey(studentRaw)); }
            else handleAsStudent(carTagRaw, normScanKey(carTagRaw));
          });
        return;
      }

      // 3. Student-only scan
      if(studentRaw){
        handleAsStudent(studentRaw.toUpperCase(), normScanKey(studentRaw));
        return;
      }

      showToast('No match');
    }
    // Debug overlay
    let scanDebugEl = null;
    function ensureScanDebug(){
      if(scanDebugEl) return scanDebugEl;
      scanDebugEl = document.createElement('div');
      scanDebugEl.id='scanDebug';
      scanDebugEl.style.cssText='position:fixed;right:6px;bottom:6px;font:11px monospace;background:#0b132bcc;color:#fff;padding:4px 6px;border-radius:6px;z-index:5000;opacity:.75;pointer-events:none;';
      scanDebugEl.textContent='scan: —';
      document.body.appendChild(scanDebugEl);
      return scanDebugEl;
    }
    function updateScanDebug(){
      const el = ensureScanDebug();
      if(!scanEnable?.checked){ el.textContent='scan: off'; return; }
      const chars = scanChars.map(c=>c.ch).join('');
      el.textContent = 'scan: '+(chars||'…');
    }
    window.addEventListener('keydown', (e) => {
      if(!scanEnable?.checked) return; // scanning disabled
      if(e.metaKey||e.ctrlKey||e.altKey) return; // ignore combos
      const active = document.activeElement;
      const isInput = !!(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable));
      // If the user is typing in a field, don't treat keystrokes as scans
      if(isInput){ scanningSuspended = true; resetScanBuffer(); return; }
      if(e.key === 'Enter' || e.key === 'Tab'){
        // Decide if buffered burst qualifies as scan
        if(tryFinalizeScan()){ if(!isInput) e.preventDefault(); }
        else resetScanBuffer();
        return;
      }
      if(e.key.length === 1){
        bufferChar(e.key);
        updateScanDebug();
        // Never block normal typing; we let characters pass through.
        // But if focus is body (not typing anywhere), prevent page scroll from space etc.
        if(!isInput && e.key === ' '){ e.preventDefault(); }
      } else if(e.key === 'Backspace' || e.key === 'Escape'){
        // Human editing pattern -> cancel any pending scan buffer
        resetScanBuffer();
        updateScanDebug();
      }
    }, true);
    // Periodic debug refresh in case quiet finalize cleared
    setInterval(()=>{ if(scanEnable?.checked) updateScanDebug(); }, 500);

    // Suspend background scan while interacting with the search box
    try{
      search?.addEventListener('focus', () => { scanningSuspended = true; resetScanBuffer(); });
      search?.addEventListener('blur',  () => { scanningSuspended = false; });
    }catch{}

    async function bootstrap(claims){
      const allowed = !!(claims && (claims.caller || claims.admin));
      if (!allowed){ try { location.replace('/index.html#login'); } catch { location.href = '/index.html#login'; } return; }
      await populateClasses();
      resubscribe();
    }

    // Support both explicit initAppWithClaims from site-header and an event-driven fallback
    window.initAppWithClaims = bootstrap;
    const now = (window.SD && (window.SD.claims || window.SD.userClaims)) || null;
    if (now) bootstrap(now);
    else window.addEventListener('sd:claims-ready', (e) => bootstrap((e && e.detail && (e.detail.claims||e.detail)) || ((window.SD && (window.SD.claims||window.SD.userClaims)) || {})), { once:true });

    classFilter?.addEventListener('change', resubscribe);
    search?.addEventListener('input', applyFilters);
    sortSel?.addEventListener('change', () => {
      const mode = sortSel?.value || 'first';
      if (mode === 'callAvg') {
        ensureAvgOffsets().then(()=>applyFilters()).catch(()=>applyFilters());
      } else {
        applyFilters();
      }
    });

    // Direct ride share QR scan (rs=TOKEN)
    document.addEventListener('scan:ride-share', async (e) => {
      const rs = (e && e.detail && e.detail.rs) ? String(e.detail.rs).trim() : '';
      if (!rs) return;
      const grp = rideShareToGroup[rs.toUpperCase()];
      try {
        if (grp && grp.id) await setStatusForGroup(grp.id, 'called');
        else if (setStatusForRideShare) await setStatusForRideShare(rs, 'called');
        showToast('Ride share called');
      } catch(err){ console.error('[tiles] ride share scan failed', err); }
    });
  </script>
  <script src="/scanner.js"></script>
</body>
